schema_version: 1
edition: unified-expanded
legacy_path: authoring/editions/1984
status: provisional
notes:
  - This is the authoritative twenty-chapter structure for the Unified Expanded Edition.
  - The reconstructed 1984 narrative is the literary foundation, not an evidence cutoff.
  - Later discoveries and events enter as identifiable editorial additions or addenda and are never retroactively attributed to Bagshot.
  - Primary concepts are retrieval hints, not canonical evidence tags.
  - Extraction-era candidate placement metadata does not override this structure.
chapters:
  - id: 1
    number: 1
    slug: before-hogwarts
    title: Before Hogwarts
    status: planned
    purpose: Establish the educational and social conditions from which Hogwarts emerged.
    primary_concepts: [pre-Hogwarts education, early magical Britain, secrecy, magical learning]
    boundaries:
      include: [conditions preceding the school's foundation]
      exclude: [the founders' individual biographies, the act of foundation]

  - id: 2
    number: 2
    slug: the-four-founders
    title: The Four Founders
    status: planned
    purpose: Introduce the founders as historical actors, collaborators, and sources of later tradition.
    primary_concepts: [Godric Gryffindor, Helga Hufflepuff, Rowena Ravenclaw, Salazar Slytherin]
    boundaries:
      include: [founder backgrounds, attributed aims, limits of founder traditions]
      exclude: [the full foundation process, detailed House development]

  - id: 3
    number: 3
    slug: the-founding-of-hogwarts
