schema_version: 1
chapter:
  id: 17
  number: 17
  slug: danger-defence-and-disaster
  title: Danger, Defence and Disaster
edition: unified-expanded
target_revision: 1
status: evidence_selected
selected_at: 2026-09-23
selection_principle: >-
  Select evidence only when it reveals a Hogwarts mechanism of prevention,
  containment, supervision, recovery, crisis response or adaptation, or when a
  failure exposes an assumption on which such a mechanism depended. Prefer
  historically informative cases to exhaustive incident lists. Preserve the
  1984 knowledge boundary and keep later observations, later historical
  discoveries and later crises explicit. Defer material already owned by the
  grounds, governance, education, pupil-life, portrait, Quidditch and
  Tournament chapters unless Chapter 17 gives it a demonstrably new
  risk-management function.
cutoff_key:
  1: pre-1984 / original-book candidate
  2: later-carried historical evidence about pre-1984 Hogwarts
  3: post-1984 observation useful for reconstructing an older institution
  4: later editorial history
  5: exclude from the 1984 reconstruction

