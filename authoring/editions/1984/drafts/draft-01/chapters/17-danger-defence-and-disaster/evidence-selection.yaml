    cutoff_classification: "5 — exclude from the 1984 reconstruction"
    reason: Hogwarts-specific wolf-cub account is undated; it cannot safely be placed before 1984 and Chapter 7 owns the grounds context.
  - id: cos-ch15-005
    cutoff_classification: "4 — later editorial history"
    reason: Acromantula colony location is already owned by Chapter 7 and adds no distinct institutional response here.
  - id: cos-ch15-006
    cutoff_classification: "2 — later-carried historical evidence about pre-1984 Hogwarts"
    reason: Hagrid's introduction of Aragog and later relocation are already fully developed in Chapter 7; retain only as a cross-chapter callback if required.
  - id: fb-ch05-002
    cutoff_classification: "4 — later editorial history"
    reason: Harry's marginal annotation corroborates the colony but adds no new Hogwarts risk-management mechanism.
  - id: fb-ch08-006
    cutoff_classification: "5 — exclude from the 1984 reconstruction"
    reason: General werewolf lore is not Hogwarts-specific and would import creature background without an institutional function.
  - id: gof-ch12-005
    cutoff_classification: "3 — post-1984 observation useful for reconstructing an older institution"
    reason: General start-of-term rule evidence duplicates Chapters 7 and 10; more specific rules are selected.
  - id: ps-ch10-003
    cutoff_classification: "4 — later editorial history"
    reason: Troll evacuation is illustrative but redundant beside better-documented crisis responses.
  - id: hbp-ch24-004
    cutoff_classification: "4 — later editorial history"
    reason: Severe spell injury adds spectacle but no unique institutional mechanism beyond treatment already selected.
  - id: dh-ch31-004
    cutoff_classification: "4 — later editorial history"
    reason: Portraits, passages and defensive movement overlap Chapter 12 and the selected siege evidence.
  - id: dh-ch32-002
    cutoff_classification: "4 — later editorial history"
    reason: Additional battle detail risks narrative recap and is not needed to establish adaptive use of castle resources.
  - corpus: Quidditch Through the Ages
    cutoff_classification: "5 — exclude from the 1984 reconstruction"
    reason: No unique Hogwarts safety evidence was found that justifies reopening Chapter 14's subject.

research_layer_gaps:
  - No direct Hogwarts-specific evidence in the selected corpus establishes that the school is Unplottable.
  - No source dates the institution of the standing concealment or anti-Apparition protections.
  - No selected source defines a general emergency code, staff probation procedure or cumulative safety policy.
  - No contemporary institutional record independently corroborates the first opening of the Chamber.
  - No source identifies the exact measures behind Hogwarts's First-War reputation for safety.
  - No selected evidence establishes post-Battle restoration beyond immediate triage and continued use of the castle.
