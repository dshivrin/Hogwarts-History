excluded_or_deferred:
  - ids: [ext-a10-001, poa-ch18-003]
    disposition: defer
    reason: >-
      The Lupin accommodation is highly relevant to adaptation, but Chapters 17
      and 18 already use it to analyse containment and the capacity of a head to
      alter school arrangements around an exceptional pupil. Reuse here would
      repeat rather than change its institutional function.
  - ids: [ext-a45-003, ext-a45-004]
    disposition: omit_from_revision
    reason: >-
      Wizarding radio and enchanted automobiles establish selective adoption in
      wider society but supply no Hogwarts use, introduction date, or school
      policy. They limit an inference but do not warrant a chapter section.
  - ids: [ext-a01-002]
    disposition: defer
    reason: >-
      Eighteenth-century plumbing is already used by Chapters 5 and 6, including
      for architectural layering. Chapter 19 may state only the inherited
      conclusion without repeating the incident.
  - ids: [ext-a04-002, ext-a04-003, ext-a04-004, ext-a04-005, ext-a19-001, ext-a19-002]
    disposition: advance_to_outline_as_compact_context
    reason: >-
      Chapter 15 owns the full transport history. Chapter 19 uses no episode or
      route description, only the bounded fact that national standardisation
      and concealed infrastructure were inherited before the twentieth century.
  - ids: [ext-a12-002, cos-ch13-002, ootp-ch28-007, ootp-ch31-002]
    disposition: advance_to_outline_as_compact_continuity
    reason: >-
      Chapters 9 and 10 own examinations and pupil offices. Chapter 19 uses these
      examples only to show repeated twentieth-century operation without an
      origin date; it must not explain duties, procedures or educational effect.
source_search_notes:
  compact_indexes: >-
    Queried modern and twentieth-century terms, administration, admissions,
    transport, Hogwarts Express, communication, owl post, examinations, O.W.L.s,
    N.E.W.T.s, prefects, Head Boy, Head Girl, Deputy Headmistress, records,
    Ministry, governors, technology, electricity, First Wizarding War, Dippet,
    Dumbledore, Riddle, Lupin and Hagrid.
  permanent_tooling: >-
    Used scripts/query_entries.py through the maintained .venv and direct
    read-only inspection of canonical source YAML; no disposable helper script
    or research-layer write was created.
  direct_source_review: >-
    Inspected the complete official Rowling source snapshots for the Hogwarts
    Express, King's Cross, technology and Remus Lupin, plus canonical novel
    records for admissions, 1943, examinations, wartime testimony and the
    Hogwarts: A History technology statement.
  overlap_review: >-
    Compared candidate functions and evidence comments against Chapters 9, 10,
    15, 17 and 18. Chapter 20 has no workspace yet, so its canonical table-of-
    contents boundary controls the reservation of Dippet-to-Dumbledore
    biography and transition chronology.
