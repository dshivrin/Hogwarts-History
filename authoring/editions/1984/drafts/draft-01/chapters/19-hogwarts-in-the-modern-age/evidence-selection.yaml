selection_principle: >-
  Select evidence only when it establishes or materially limits what changed,
  persisted, or became newly consequential as Hogwarts operated in the
  twentieth-century wizarding world through 1984. Earlier evidence supplies
  inherited context only. Reuse from Chapters 9, 10, 15, 17 and 18 requires a
  distinct longitudinal or modern-institution function, and heavily owned
  material is deferred even when relevant.
source_access_key:
  1: directly available to the reconstructed pre-1984 account or explicit original-book core
  2: pre-1984 event preserved only by later testimony
  3: post-1984 observation demonstrating an older practice without dating its origin
  4: later editorial history
  5: excluded or deferred
