selection_principle: >-
  Select evidence only when it establishes, corroborates, changes, limits, or
  provides a historically significant exception to a Hogwarts communal custom.
  Keep annual practice separate from one-off events, later observation separate
  from 1984 knowledge, and ceremonial function separate from unsupported origin
  stories.
chronology_key:
  A: securely pre-1984 event or condition
  B: pre-1984 event reported or explained only by a later source
  C: post-1984 observed practice that may confirm recurrence but not origin
  D: post-1984 exceptional event
  E: undated retrospective statement

