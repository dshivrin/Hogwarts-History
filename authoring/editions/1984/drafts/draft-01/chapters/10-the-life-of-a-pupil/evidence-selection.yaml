status: evidence_reviewed
review_date: 2026-09-23
research_basis:
  - authoritative contents, authoring workflow, evidence policy, Draft-01 style lock, and Chapter 9 audited working baseline
  - concept searches across the complete structured corpus for daily routine, House residence, meals, homework, recreation, friendship, correspondence, Hogsmeade, holidays, discipline, prefects, health, material life, and economic difference
  - direct inspection of every selected canonical YAML record and bounded inspection of the most consequential underlying novel passages
  - rendered visual inspection of The Tales of Beedle the Bard PDF pages 26-28 covering Dumbledore's Christmas pantomime account
  - screening of Fantastic Beasts, Quidditch Through the Ages, Beedle, official Rowling sources, preserved interviews, explicit Hogwarts: A History references, duplicate clusters, open questions, and Chapters 1-9 for overlap
selection_principle: >-
  Select evidence only when it establishes or materially limits recurring
  residential, social, temporal, disciplinary, communicative, medical, or
  material experience at Hogwarts. Isolated plot events advance only when
  they reveal a wider lived practice, a bounded historical example, or an
  exceptional contrast that the chapter must explicitly label.

