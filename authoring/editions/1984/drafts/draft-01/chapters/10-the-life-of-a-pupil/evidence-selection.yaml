chronology_key:
  A: directly usable pre-1984 documentary evidence
  B: pre-1984 event or condition established through later testimony, memory, or commentary
  C: later observation or undated commentary on a potentially older practice with continuity unproven
  D: post-1984 observation, procedure, or development
  E: uncertain or internally conflicting chronology

excluded_or_deferred:
  - ids: [ext-a07-001, ext-a07-002, ext-a07-003, ext-a07-004, cos-ch12-005, dh-ch29-005]
    reason: Detailed common-room entrances and interiors exceed the lived-experience need and risk repeating Chapter 6 architecture.
  - ids: [gof-ch21-006, gof-ch12-004, ootp-ch13-002, ootp-ch14-001, ootp-ch18-004]
    reason: Kitchen and service-labour evidence would reopen the draft-wide decision to preserve silence on Hogwarts house-elf servitude.
  - ids: [hbp-ch25-002, cc-p2-a4-s09-001]
    reason: A decades-old Gobstones clipping and altered-timeline Exploding Snap scene are too thin to establish a general extracurricular or games culture.
  - ids: [poa-ch10-004, ootp-ch20-001, gof-ch25-001]
    reason: Secret-passage incidents establish exceptional evasion more strongly than ordinary pupil movement and are already available to the castle chapters.
  - ids: [ootp-ch17-003, ootp-ch28-004, ootp-ch29-005]
    reason: Umbridge-era communication surveillance is adequately represented by the concrete inspected parcel and should not dominate ordinary correspondence.
  - ids: [ootp-ch28-002, ootp-ch29-007, dh-ch30-002]
    reason: Inquisitorial Squad powers, proposed whipping, and Carrow-era coercion are exceptional governance or wartime material; only the blood quill is retained as the necessary exceptional-abuse contrast.
  - ids: [ext-a37-001]
    reason: The official extension-charm account calls enhanced Hogwarts trunks standard but does not date the practice; ordinary luggage handling is independently supported without this uncertain claim.
  - ids: [beedle-ch00-002]
    reason: Shared childhood familiarity with Beedle is valid cultural evidence but unnecessary unless the chapter develops reading culture beyond the stronger residential argument.
  - ids: [fb-ch07-002]
    reason: Creature-licensing context adds little to the direct school pet evidence and would pull the section into general creature law.
  - ids: [cc-p1-a2-s08-004, cc-p2-a3-s10-001]
    reason: Altered-timeline discipline and Hogsmeade material cannot establish primary-timeline practice.

source_search_notes:
  novels: All seven novels were searched across the structured corpus by concept; selected records were inspected in canonical YAML and consequential passages were checked against bounded PDF extracts.
  fantastic_beasts: Complete structured entries were screened; student marginalia and pet-law context are colorful but do not materially improve the residential reconstruction.
  quidditch_through_the_ages: Complete structured entries were screened; relevant material concerns sport history and governance rather than ordinary pupil life, so later match-day observations are used only for social culture.
  tales_of_beedle_the_bard: Complete structured entries were screened; the Dippet-era pantomime entries were selected and PDF pages 26-28 were rendered and visually inspected.
  official_external: Relevant official sources on pets, common rooms, trunks, and Lockhart were screened; the pet rule and pre-1984 detention were selected, while architectural and undated trunk details were deferred.
  preserved_interviews: Screened; no authority-D transcript materially improves the selected reconstruction beyond stronger novel, memory, or official evidence.
  cursed_child: Screened; altered-timeline school-life evidence was excluded and later primary-timeline material was unnecessary.
  pensieve_evidence: Riddle-era and Marauders-era memories were inspected and selected only for the social, economic, disciplinary, or relational conditions they actually show.
  explicit_hogwarts_a_history: Screened; the founder-attributed gendered dormitory rule was selected with its later-access limitation retained.
