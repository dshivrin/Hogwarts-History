selection_principle: >-
  Select evidence only when it establishes or materially limits the continuity,
  power, delegation, judgement, influence, appointment, removal or external
  constraint of the Headmaster or Headmistress. Reuse evidence from Chapters 8,
  12, 15 and 17 only where its analytical function changes from governance,
  institutional memory, external relations or safety to comparison between the
  office and an individual holder. Preserve gaps rather than manufacture a
  continuous list or constitutional system.
cutoff_key:
  1: reconstructed pre-1984 knowledge
  2: later-carried history about pre-1984 Hogwarts
  3: post-1984 observation useful for reconstructing an older institution
  4: later editorial history
  5: excluded or deferred
