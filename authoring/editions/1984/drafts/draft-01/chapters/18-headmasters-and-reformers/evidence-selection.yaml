excluded_or_deferred:
  - ids: [cos-ch13-006, ext-a05-004]
    reason: Office architecture and portrait observation are already owned by Chapters 6 and 12 and add no distinct authority claim here.
  - ids: [ootp-ch06-005]
    reason: Phineas Nigellus's reported unpopularity is biographical reputation without enough institutional detail; his secure former-head status is already carried by ootp-ch22-002.
  - ids: [cos-ch18-003]
    reason: Special House points show one head exercising ceremonial discretion but add little beyond stronger examples and risk repeating Chapters 4 and 13.
  - ids: [poa-ch21-001]
    reason: External legal limits are already established in Chapter 8; Chapter 18 uses more direct school-status and Ministry-intervention evidence.
  - ids: [ootp-ch17-001, ootp-ch25-003, ootp-ch26-002, ootp-ch27-006, ootp-ch28-002, ootp-ch28-003]
    reason: These add detailed Umbridge-era controls after the selected entries establish the distinct offices and boundary conflicts; defer to avoid allowing the exceptional period to dominate.
  - ids: [dh-ch30-006, dh-ch31-001]
    reason: Battle defence and evacuation are fully owned by Chapter 17; Chapter 18 retains only the transfer of practical authority and delegated planning.
  - ids: [beedle-fm-004, beedle-ch04-003]
    reason: Post-war McGonagall material confirms later headmistress status but is unnecessary once immediate succession and delegated authority are established.
  - ids: [ext-b09-007]
    reason: Snape's post-war portrait dispute concerns later commemoration rather than the powers and limits of his wartime headship.
  - ids: [cc-p1-a2-s20-003, cc-p1-a1-s07-004, cc-p2-a3-s14-004]
    reason: Altered-timeline governance cannot establish the primary institutional history.
source_search_notes:
  compact_indexes: Queried headmaster, headmistress, headmaster-authority, headmastership, deputy-headmistress, governors, staff appointments, educational decrees, High Inquisitor, Dippet, Dumbledore, Umbridge, Snape and McGonagall concepts.
  novels: Screened all seven novel source families; directly inspected pivotal Dippet, Dumbledore, governor, Umbridge, Snape and McGonagall passages.
  companion_books: Screened Beedle evidence for Dippet, Kettleburn, governors and later McGonagall material; selected only institutionally consequential entries.
  official_external: Screened official portrait, Pensieve, Chamber, Lupin, Peeves, Lockhart and McGonagall sources; selected the entries that materially establish continuity or exercised authority.
  interviews_and_cursed_child: Screened; later portrait commentary and altered-timeline governance were excluded or deferred.
  earlier_chapters: Compared every selected cluster with Chapters 8, 12, 15 and 17 and searched earlier draft evidence comments for repeated IDs.
