chronology_key:
  A: directly usable pre-1984 documentary evidence
  B: pre-1984 event or condition established through later testimony or commentary
  C: later observation of a potentially older practice with continuity unproven
  D: post-1984 observation, procedure, or development
  E: uncertain or internally conflicting chronology

excluded_or_deferred:
  - ids: [ext-a03-001]
    reason: The founder attribution for the Book and Quill would repeat Chapters 2 and 3 and does not establish the founders' curriculum.
  - ids: [ext-a03-005, ext-a03-006]
    reason: The Neville illustration and Squib boundary add admissions biography and social-policy detail without improving the educational structure required here.
  - ids: [poa-ch04-004]
    reason: The elective list is already established by an official summary and the second-year selection scene; Hermione's exceptional course load risks drifting into Chapter 10.
  - ids: [ext-a18-004]
    reason: The author's early planning notes describe out-of-world creative development, not an in-world earlier Hogwarts curriculum.
  - ids: [ootp-ch12-002, hbp-ch05-007]
    reason: Informal explanations of course consequences are superseded by observed career advice, official results, and actual sixth-year placement.
  - ids: [gof-ch15-002, ootp-ch31-001]
    reason: Workload anxiety and revision culture belong primarily to Chapter 10 once the educational mechanisms are established elsewhere.
  - ids: [poa-ch16-004, poa-ch16-005]
    reason: Teacher-specific examination scenes would turn the assessment section into a catalogue without adding a distinct institutional mechanism.
  - ids: [ext-a12-003]
    reason: McGonagall's Animagus training is exceptional mentorship and cannot establish ordinary Transfiguration progression.
  - ids: [cc-p1-a1-s07-004, cc-p2-a3-s14-004]
    reason: Altered-timeline school evidence cannot establish the primary educational history.

source_search_notes:
  novels: All seven novels were searched by concept and selected records were checked against the complete bounded PDF passages.
  fantastic_beasts: The complete structured entries were screened; scan-only pages 7 and 9 were rendered and visually inspected for the textbook relationship.
  quidditch_through_the_ages: Screened; useful material concerns sport history rather than the educational framework of this chapter.
  tales_of_beedle_the_bard: Screened; no entry materially improves the selected account of curriculum structure or examination progression.
  official_external: Complete admitted snapshots on admissions, school subjects, McGonagall, and relevant professors were screened; A03, A12, and A18 material was selected.
  preserved_interviews: Screened with authority distinctions retained; B01 is used only for age, annual notification, and its explicit conflict with A03.
  cursed_child: Completed structured evidence screened; altered-timeline material excluded and later primary-timeline material unnecessary.
  explicit_hogwarts_a_history: Screened; no explicit citation supplies a curriculum or examination structure strong enough to add to the selected set.
