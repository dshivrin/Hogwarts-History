research_basis:
  - authoritative contents, authoring workflow, evidence policy, Draft-01 style lock, and Chapter 8 approved baseline
  - concept searches across the complete structured corpus for admission, lessons, subjects, books, homework, examinations, qualifications, course choice, teaching methods, and curriculum change
  - direct inspection of every selected canonical YAML record and its complete underlying PDF passage or external-source snapshot
  - visual inspection of the scan-only Fantastic Beasts pages establishing textbook approval and publication history
  - review of explicit Hogwarts: A History references, open questions, duplicate clusters, and Chapters 1–8 for overlap
selection_principle: >-
  Select evidence only when it establishes or materially limits the structure,
  content, method, assessment, or historical development of Hogwarts education.
  Pupil experience advances only when it reveals an educational mechanism.

