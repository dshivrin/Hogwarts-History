core:
  - id: cos-ch09-003
    role: direct historical support
    supports: >-
      The uncertain age of the foundation, the four founders, the remote castle,
      Muggle fear and persecution, and the founders' practice of seeking out
      magical youngsters and bringing them to the castle for education.
    confidence: high
    notes: >-
      Professor Binns distinguishes this account from the Chamber legend but does
      not identify his sources. This is the only inspected record that directly
      joins the social setting to the creation and educational use of Hogwarts.

  - id: ext-a17-002
    role: direct pre-Hogwarts material evidence
    supports: >-
      The Hogwarts Pensieve is an ornately carved stone artefact bearing
      modified Saxon runes and is explicitly described as older than the school.
    confidence: high
    notes: >-
      This establishes that modified Saxon runes formed part of the craftsmanship
      of a pre-Hogwarts magical artefact. It does not establish that the runes
      themselves performed magic, nor a rune school, curriculum, maker, or dating
      method beyond the official source's characterisation of the object.

supporting:
  - id: ext-a08-003
    role: direct historical context
    supports: >-
      Pre-Statute wizards and Muggles mingled, and defence could involve both
      mundane weapons and wands.
    confidence: high
    notes: >-
      Official retrospective source. It supplies social texture, not proof of a
      particular educational arrangement or a complete founder-era norm.

  - id: fb-ch02-001
    role: direct historical context
    supports: >-
      Medieval Muggle art and literature retained imperfect knowledge of magical
      creatures.
    confidence: high
    notes: >-
      Supports an environment of visibility rather than total separation. The
      record does not date particular examples to Hogwarts's founding.

  - id: fb-ch02-002
    role: source-method support
    supports: >-
      Medieval Muggle bestiaries may preserve distorted or mistaken evidence of
      magical creatures.
    confidence: high
    notes: >-
      Useful for showing both the value and limits of non-magical records; it does
      not establish educational practice.

  - id: fb-ch02-003
    role: concrete medieval historical context
    supports: >-
      A fragment attributed to Brother Benedict records an encounter with what
      Newt Scamander identifies as a Jarvey pursuing gnomes in a herb garden.
    confidence: high
    notes: >-
      The manuscript fragment provides concrete texture for Muggle contact with a
      magical creature, but Scamander's species identification is retrospective
      and the episode does not describe wizard–Muggle social relations.

  - id: fb-ch02-004
    role: direct historical context
    supports: >-
      Misunderstood magic and creature sightings contributed to Muggle fear and
      intensified persecution in a broadly medieval setting.
    confidence: high
    notes: >-
      Corroborates the general climate in cos-ch09-003 but the exact period meant
      by “this time” is contextual, so it cannot independently date the founder
      era or prove why Hogwarts itself was founded.

  - id: qtta-ch01-002
    role: dated early-medieval material context
    supports: >-
      European broom flight is documented in 962; the surviving account describes
      early brooms as discreet, crude, uncomfortable, and capable of only limited
      control.
    confidence: high
    notes: >-
      This is the strongest newly retrieved fixed date for an early magical
      craft. The foundation date is too imprecise to prove whether 962 preceded
      or followed the school's opening, so the record supplies a shared broad
      historical horizon rather than a sequence. It concerns European transport,
      not Hogwarts or British educational practice.

  - id: ps-ch05-007
    role: bounded traditional claim about old wandcraft
    supports: >-
      The Ollivander establishment publicly dates its wandmaking name to 382 BC.
    confidence: medium
    notes: >-
      The dated shop sign is observed in a later narrative. It may support a
      clearly attributed antiquity claim for specialist wandmaking, but not
      uninterrupted institutional continuity, founder-era teaching, or the age
      of any particular wand practice.

  - id: beedle-fm-002
    role: later historical comparison
    supports: >-
      Wizarding childhood literature was transmitted at bedtime for centuries
      and became shared cultural knowledge among many Hogwarts pupils.
    confidence: high
    notes: >-
      Demonstrates a durable household channel of cultural learning in later
      centuries. It does not establish that Beedle's tales, or an equivalent
      system, existed before Hogwarts.

  - id: beedle-ch04-001
    role: later historical comparison
    supports: >-
      Wizarding children could first encounter basic limits of magic through a
      family story rather than formal instruction.
    confidence: high
    notes: >-
      Dumbledore generalises from later wizarding childhood. Use only to show that
      informal learning is evidenced somewhere in magical history, not to supply
      a founder-era curriculum.

  - id: ext-a17-003
    role: explicitly unsubstantiated foundation legend
    supports: >-
      Later tradition claimed that the founders found the ancient Pensieve
      half-buried where they chose to build Hogwarts.
    confidence: high
    notes: >-
      The source itself labels the story unsubstantiated. Revision 02 uses it
      only to contrast the securely ancient object with the later legend that
      gathered around it.

  - id: ext-a40-001
    role: broad historical context for shared objects
    supports: >-
      Muggles and magical people once used the same suspended cooking vessels,
      while cauldrons later remained in wizarding use for potion-making.
    confidence: high
    notes: >-
      The source gives no century for the transition. Revision 02 uses it as a
      broad example of shared ordinary life, not as a founder-era kitchen claim.

  - id: ext-a40-002
    role: undated technical description of potion vessels
    supports: >-
      Potion-making requires a naked flame, making a suspended cauldron a
      practical vessel for the craft.
    confidence: high
    notes: >-
      Supplies the material reason for continued cauldron use but no date for
      the practice.

  - id: ext-a41-001
    role: qualified tradition about ancient British wandcraft
    supports: >-
      Mr Ollivander believes his forebears reached Britain with the Romans and
      sold crafted wands to British wizards using cruder instruments.
    confidence: medium
    notes: >-
      The chapter attributes the claim to Ollivander family belief and does not
      treat it as independent proof or an unbroken commercial chronology.

  - id: ext-a42-001
    role: undated technical description of wand-wood knowledge
    supports: >-
      Only a minority of trees yield wand-quality wood, recognition requires
      long experience, and Bowtruckles may serve as a practical sign.
    confidence: high
    notes: >-
      Shows plant, creature, and craft knowledge meeting in wandmaking without
      dating the discovery or transmission of that knowledge.

  - id: ext-a42-002
    role: direct medieval wandcraft evidence
    supports: >-
      Geraint Ollivander was a noted medieval wandmaker whose written craft
      observations survived into later family knowledge.
    confidence: high
    notes: >-
      Establishes a named medieval craft tradition but gives no closer date and
      does not connect Geraint to Hogwarts.

  - id: ext-a45-001
    role: broad pre-Statute social context
    supports: >-
      Wizards and Muggles used the same everyday transport, including
      horse-drawn carts and sailing ships, before legal separation.
    confidence: high
    notes: >-
      Makes shared historical life concrete without projecting the entire
      pre-Statute period into the founders' particular decade.

later_confirmation:
  - id: ext-a38-001
    role: post-foundation medieval comparison
    supports: >-
      In twelfth-century Britain, Linfred of Stinchcombe cultivated unusual
      plants, experimented privately, and supplied medicinal help to Muggle
      neighbours from his household.
    confidence: high
    notes: >-
      Linfred lived after Hogwarts was founded. His value is to show that
      healing, plant knowledge, experiment, and local service continued outside
      the school, not to prove the same pattern in the founders' century.

  - id: ext-a38-002
    role: post-foundation medieval comparison
    supports: >-
      Linfred's remedies developed into later potions and were sold to other
      witches and wizards.
    confidence: high
    notes: >-
      Demonstrates household innovation and wider transmission in the twelfth
      century; it gives neither pre-Hogwarts potion evidence nor recipe history.

  - id: ext-b04-001
    role: bounded comparison for education before school entry
    supports: >-
      In the Harry-era setting, children might attend Muggle primary school or be
      educated at home; the Weasleys are given as a home-educated example.
    confidence: medium
    notes: >-
      Authority-D preservation transcript from 2004. It gives no dates or early
      history and therefore cannot establish pre-Hogwarts practice.

  - id: ext-b02-002
    role: bounded comparison for education before school entry
    supports: >-
      Attendance at Muggle school was not universally required before Hogwarts
      in the Harry-era setting.
    confidence: medium
    notes: >-
      Authority-D preservation transcript from 2000. It narrows modern practice
      but supplies neither alternatives nor a historical origin.

uncertain:
  - id: ext-a28-001
    role: possible comparative evidence only
    supports: >-
      An undated worldwide pattern of home-schooling and correspondence courses
      where formal magical schools are absent.
    confidence: high
    notes: >-
      Official 2016 source classified unknown_or_uncertain. Its general present-
      tense claim must not be back-projected into pre-foundation Britain.

  - id: ext-a28-002
    role: possible institutional comparison only
    supports: >-
      A modern or undated distinction between established registered schools and
