chapter: 1
selected_at: '2026-09-13'
candidate_records_inspected: 43
selection_basis:
  - Canonical YAML was reviewed for every listed record.
  - Index and duplicate results were used for discovery and corroboration only.
  - Later or undated educational practices are not projected into the founder era.

revision_01_retrieval:
  inspected_at: '2026-09-14'
  canonical_records_inspected: 24
  focus:
    - potions, ingredients, antidotes, and alchemy
    - herbs, magical plants, remedies, and healing
    - wandmaking, wand use, and runic artefacts
    - broom flight and other early magical crafts
    - magical-creature knowledge and Muggle records
    - medieval and pre-Statute magical–Muggle relations
  selected_result: >-
    Dated early-medieval broom evidence, a bounded wandmaking antiquity claim,
    and a concrete medieval creature encounter materially expand the chapter.
    The inspected potion, plant, healing, runic, and most creature records do not
    securely date those practices before Hogwarts and are therefore retained
    only as limits or cross-chapter material.
