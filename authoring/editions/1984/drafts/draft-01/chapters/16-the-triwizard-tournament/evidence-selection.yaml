selection_principle: >-
  Select only evidence that establishes or materially limits the Tournament's
  purpose, three-school structure, representation of schools by champions,
  historical judging and danger, discontinuation, or revival. Give exceptional
  weight to the 1792 account explicitly attributed to Hogwarts: A History.
  Treat the densely documented 1994-95 Tournament as explanatory and
  comparative evidence, never as an automatic statement of ancient practice.
  Preserve the later Hogwarts-Beauxbatons victory totals only as an unresolved
  source tension, not as a basis for chronology or calculation.
chronology_key:
  A: direct or explicitly attributed pre-1984 historical evidence
  B: pre-1984 history carried by post-1984 testimony
  C: post-1984 mature or revival practice that may illuminate but not establish older procedure
  D: post-1984 exceptional event or failure
  E: undated later retrospective statement

