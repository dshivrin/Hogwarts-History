chapter: 14
title: Quidditch
revision: 1
selection_status: complete_for_editorial_review
scope_note: >-
  Existing extracted evidence only. General Quidditch evidence supplies chronology
  and context, not Hogwarts facts. Later school observations describe the mature
  institution unless an entry explicitly carries an older condition.

access_classes:
  general_direct: Direct statement about Quidditch generally; not Hogwarts-specific.
  pre_1984_direct: Evidence whose asserted Hogwarts condition or event predates 1984.
  later_carried: Post-1984 source preserving or displaying a pre-1984 Hogwarts condition.
  later_observed: Post-1984 observation of the mature Hogwarts institution.
  later_exceptional: Post-1984 crisis or exceptional intervention; not ordinary procedure.

