selection_principle: >-
  Select evidence only when it establishes or materially limits the use,
  preservation, organisation, restriction, circulation, age, cultural role,
  or governance of written knowledge at Hogwarts. Named works advance only
  when they demonstrate a larger institutional function. Later procedures
  remain later evidence unless an older fact is independently supported.

