chronology_key:
  A: directly usable pre-1984 documentary evidence
  B: older event, work, record, or condition established through later testimony, memory, or commentary
  C: post-1984 ordinary observation or institutional case with continuity unproven
  D: exceptional post-1984 political, wartime, or emergency condition
  E: uncertain or internally conflicting chronology

excluded_or_deferred:
  - ids: [ps-ch11-003]
    reason: Snape's asserted rule against taking library books outside school is contested within the scene and lacks sufficient corroboration for ordinary policy.
  - ids: [hbp-ch09-005, hbp-ch16-006]
    reason: The old Advanced Potion-Making copy belongs to a classroom stock, not a demonstrated library holding; retain only as a possible contrast if later needed.
  - ids: [beedle-ch01-004]
    reason: Beatrix Bloxam concerns publishing and family reading rather than Hogwarts collection governance.
  - ids: [ext-a17-001]
    reason: The school Pensieve is non-written and belongs more naturally to Chapter 12's treatment of institutional memory.
  - ids: [cc-p1-a1-s19-001]
    reason: The much-later Sonnets of a Sorcerer claim is too remote and uncorroborated to establish earlier Restricted Section policy.
  - ids: [ootp-ch25-007, ootp-ch26-001]
    reason: The Quibbler's publication and arrival are background to the selected exceptional possession ban; the chapter does not need the full press campaign.

source_search_notes:
  novels: All seven novels were searched through the structured corpus; selected records were inspected in canonical YAML.
  fantastic_beasts: The approved-textbook foreword was selected as the strongest older curricular anchor.
  quidditch_through_the_ages: The library plate and foreword were selected for circulation, popularity, stewardship, and protection evidence.
  tales_of_beedle_the_bard: Cultural transmission, the later archive, and the Malfoy collection challenge were selected with chronology limits retained.
  official_external: The Pensieve account was screened and deferred to Chapter 12 because it is non-written institutional memory.
  preserved_interviews: Screened; no authority-D interview improves the chapter's institutional case beyond stronger primary carriers.
  cursed_child: Screened; the later banned-book claim was deferred as too remote to establish earlier policy.
  explicit_hogwarts_a_history: Every indexed explicit reference was screened and selected so the work's use, ownership, authority, repetition, and omissions can be assessed together.
