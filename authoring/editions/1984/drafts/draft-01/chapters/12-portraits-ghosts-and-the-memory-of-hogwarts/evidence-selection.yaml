research_basis:
  - approved Chapter 12 research package, including its evidence inventory, gap audit, ambiguity review, paragraph-level architecture, and editorial recommendation
  - direct inspection of every selected canonical YAML record, including the newly indexed A17 Pensieve-mechanics passage and Beedle photograph/portrait/ghost footnote
  - Chapter 11 working manuscript as the entry-point baseline and Chapter 4 approved manuscript as the boundary for Sorting Hat origins and House consequences
selection_principle: >-
  Select evidence only when it establishes or materially limits a distinct
  responsive form of Hogwarts memory: ghosts as surviving witnesses, portraits
  as constructed likenesses, trained head portraits as succession support, the
  Sorting Hat as founder-associated judgement, or Pensieve memories as
  revisitable evidence. Keep later behaviour in the later layer, attribute
  traditions and retrospective explanations, and reject any inference from
  responsiveness to identity, consciousness, omniscience, resurrection, or
  continuous pre-1984 institutional practice.

