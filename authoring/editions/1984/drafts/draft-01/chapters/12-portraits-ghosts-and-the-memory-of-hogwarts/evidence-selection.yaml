chronology_key:
  A: directly usable pre-1984 evidence or general proposition explicitly available by 1984
  B: older event, object, tradition, or condition established through a later carrier
  C: post-1984 ordinary observation, explanation, or editorial note with continuity unproved
  D: exceptional post-1984 crisis, wartime, or emergency condition
  E: undated retrospective explanation or otherwise uncertain chronology

excluded_or_deferred:
  - ids: [cos-ch11-006]
    reason: Ghost petrification is a striking physical anomaly but does not materially advance the chapter's institutional-memory argument.
  - ids: [hbp-ch24-003]
    reason: Myrtle's later observation of one pupil duplicates the stronger testimony examples without improving chronology or reliability analysis.
  - ids: [ootp-ch24-004, ootp-ch28-007]
    reason: The portable Pensieve and one Marauders-era scene add examples but are unnecessary once mechanics, historical method, and chronology are separately established.
  - ids: [ext-a05-004]
    reason: Sleeping-listener lore is useful background but the selected training, service, and bias evidence carries the institutional claim more directly.
  - ids: [dh-ch33-002, hbp-ch29-005]
    reason: Battle observation and immediate portrait appearance are later exceptional details not required for the bounded succession argument.
  - ids: [ps-ch07-002]
    reason: Chapter 13 owns the Sorting ceremony; Chapter 12 selects only evidence bearing on preserved judgement, songs, warning, and pre-1984 operation.
  - ids: [cc-p1-a2-s08-002, cc-p1-a2-s10-002, cc-p2-a4-s04-002]
    reason: Much-later dramatic or altered-timeline portrait formulations are unnecessary because primary-narrative and official explanatory evidence establish the required distinctions.

source_search_notes:
  canonical_scope: The complete corpus search recorded in the approved research package was not expanded.
  new_gap_entries: ext-a17-005 and beedle-ch04-007 were added solely to close the two approved VERIFY_SOURCE gaps.
  chronology: Most operational portrait, ghost, and Pensieve evidence remains a later unified-edition layer; it is not silently projected into 1984.
  chapter_boundaries: Chapter 4 retains the House argument, Chapter 11 the written store, Chapter 13 the recurring ceremony, and Chapter 12 the mechanisms and limits of responsive memory.
