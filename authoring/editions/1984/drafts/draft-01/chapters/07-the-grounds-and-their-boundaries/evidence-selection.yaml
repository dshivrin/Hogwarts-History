chronology_key:
  A: pre-1984 / original-book candidate
  B: pre-1984 fact established by later source
  C: later observation of an undated feature
  D: post-1984 historical development
  E: uncertain

excluded_or_deferred:
  - ids: [qtta-ch05-001, qtta-ch06-001]
    reason: General pitch siting and dimensions do not establish the Hogwarts pitch's date, exact dimensions, or enchantments; reserve for Chapter 14.
  - ids: [ext-a09-005, gof-ch26-005]
    reason: The 1995 second-task staging is useful only as a brief example of exceptional lake use; detailed tournament procedure belongs to Chapter 16.
  - ids: [fb-ch03-005]
    reason: General safe-habitat practice is context, not proof that Hogwarts was legally or deliberately constituted as a creature reserve before 1984.
  - ids: [fb-ch05-001, fb-ch05-002]
    reason: Acromantula taxonomy and Harry-copy marginalia add little to the place argument once the Hogwarts colony and its origin are established directly.
  - ids: [poa-ch04-007, ootp-ch24-002, hbp-ch08-006]
    reason: Crisis security corroborates changing protection but would pull the chapter into war and governance detail.
  - ids: [hbp-ch08-007]
    reason: Grawp's later mountain cave is not securely located within Hogwarts grounds.
  - ids: [ext-a27-004]
    reason: The intelligent-wolf-cub account is undated/uncertain and unnecessary to the argument.
  - ids: [cc-p2-a3-s09-001, cc-p2-a3-s19-002]
    reason: Altered-timeline or later-crisis material cannot establish primary Hogwarts landscape history.

source_search_notes:
  novels: All seven novels were included through corpus-wide tag and duplicate queries.
  fantastic_beasts: Used only to explain already attested centaur and merpeople status; not used to populate Hogwarts by inference.
  quidditch_through_the_ages: Relevant pitch entries screened and deferred as general rather than Hogwarts-specific.
  tales_of_beedle_the_bard: Screened; no evidence materially advanced the landscape argument.
  official_external: A04 and A09 selected; lower-authority interview material was unnecessary.
  cursed_child: Extraction is complete and admissible; two primary-timeline later-continuity entries are selected only as post-1984 editorial evidence.
