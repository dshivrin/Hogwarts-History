    reason: Altered-timeline governance cannot establish the primary institutional history.

source_search_notes:
  novels: All seven novels were searched; selected entries were inspected in canonical YAML and underlying PDF passages.
  fantastic_beasts: Screened; no entry materially improves the selected account of offices or jurisdiction.
  quidditch_through_the_ages: Screened; institutional material belongs to sport history rather than this chapter.
  tales_of_beedle_the_bard: Two Dippet-era entries selected for headmaster rules and staff probation; library material deferred.
  official_external: Screened; later official interpretation was unnecessary once direct narrative evidence was selected.
  cursed_child: Completed extraction screened; altered-timeline material excluded and later primary-timeline material unnecessary.
