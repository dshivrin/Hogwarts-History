selection_principle: >-
  Select evidence only when it establishes or materially limits the chronology,
  overlap, succession, school-facing judgement or institutional consequences of
  the Dippet and Dumbledore periods through 1984. Biographical evidence advances
  only when it changes the history of Hogwarts. Reuse from Chapters 9, 10, 15,
  17, 18 and 19 requires a distinct chronological or inheritance function.
source_access_key:
  1: directly available to the reconstructed pre-1984 account or explicit original-book core
  2: pre-1984 event preserved only by later testimony, memory or retrospective
  3: post-1984 observation demonstrating an older condition without dating its origin
  4: later editorial history
  5: excluded or deferred
