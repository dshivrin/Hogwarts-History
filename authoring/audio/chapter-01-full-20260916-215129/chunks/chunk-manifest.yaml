- index: 4
  path: chunks/chunk-004.wav
  sha256: 86caeac7704917b98a5f2e0b34cd386e705770cffddec56b62839278c7630390
  size_bytes: 1903244
  kind: paragraph
  ends_block: true
  word_count: 89
  text: The history of Hogwarts begins before Hogwarts had a history of its own. A
    school preserves registers, rules, appointments, disputes and recollections; the
    world preceding it leaves no such convenient deposit. What survives from that
    world is scattered among later histories, old objects, specialist books and the
    imperfect notice of Muggles. The fragments are unequal, but they are not silent.
    They describe a magical society already in possession of skilled arts, already
    sharing Britain with its non-magical neighbours, and already facing the difficulty
    of remaining visible without becoming vulnerable.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 951600
    duration_seconds: 39.65
    peak: 0.3960997462272644
    non_silent_samples: 880804
    finite: true
    opening_silence_samples: 5002
    closing_silence_samples: 4354
- index: 5
  path: chunks/chunk-005.wav
  sha256: acddee59a76f58303cca2dd3762b04617aed1507fb0384532c8cfe67386d0b44
  size_bytes: 1819244
  kind: paragraph
  ends_block: true
  word_count: 97
  text: Hogwarts is older than the present millennium. Its precise year of foundation
    was uncertain even in the account most commonly taught at the school, and no day
    or season can responsibly be supplied. The secure outline is spare. Four witches
    and wizards built a castle far from Muggle observation, sought out young people
    who showed signs of magic, brought them to that place and educated them there.
    The founders, the gathering of pupils, the remoteness of the site and the purpose
    of instruction belong to history; much of the picturesque detail later attached
    to them belongs elsewhere.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 909600
    duration_seconds: 37.9
    peak: 0.41273233294487
    non_silent_samples: 842283
    finite: true
    opening_silence_samples: 5018
    closing_silence_samples: 4349
- index: 6
  path: chunks/chunk-006.wav
  sha256: 84b735ec7f252c782f1d9a8fb03b49adddeecdf883299dbdcdfe3abc06e07a29
  size_bytes: 1318844
  kind: paragraph
  ends_block: true
  word_count: 71
  text: That outline corrects one persistent illusion. Hogwarts did not bring magic
    into an empty country. The people who made the school were already accomplished
    practitioners, and the children they sought displayed magic before the school
    received them. Knowledge, skill and magical identity therefore existed on both
    sides of the foundation. What changed was not the existence of magic but the way
    part of magical society attempted to preserve and transmit it.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 659400
    duration_seconds: 27.475
    peak: 0.40955838561058044
    non_silent_samples: 611365
    finite: true
    opening_silence_samples: 5005
    closing_silence_samples: 4357
- index: 7
  path: chunks/chunk-007.wav
  sha256: f9b3230947834712291594e709d96eccebda273303d7c348eb2430956abd3e4e
  size_bytes: 1296044
  kind: paragraph
  ends_block: true
  word_count: 72
  text: Schools tend to annex the past in retrospect. Once generations have learnt
    Potions, Charms, Ancient Runes or Herbology under those names, the subjects take
    on the appearance of timeless divisions. They were not. A useful plant did not
    wait for a Herbology lesson before revealing its virtues, nor did an ancient maker
    need a timetable before carving runes. The school subject is an arrangement of
    knowledge, not proof of the knowledge's beginning.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 648000
    duration_seconds: 27.0
    peak: 0.39127781987190247
    non_silent_samples: 599848
    finite: true
    opening_silence_samples: 5012
    closing_silence_samples: 4354
- index: 8
  path: chunks/chunk-008.wav
  sha256: a295a7efc2a159cbac4386c9538f556dae8bad453d09e5e8650f5097bc1832e0
  size_bytes: 1436444
  kind: paragraph
  ends_block: true
  word_count: 78
  text: No general system of education before Hogwarts can now be described. No account
    of an earlier British school, a common curriculum or an ordinary course of childhood
    instruction survives. That forbids an invented procession of village masters and
    family academies; it does not require us to imagine that each generation rediscovered
    magic afresh. A society capable of producing the founders had plainly learnt how
    to carry difficult knowledge across time, even if most of the routes have disappeared.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 718200
    duration_seconds: 29.925
    peak: 0.365489661693573
    non_silent_samples: 665650
    finite: true
    opening_silence_samples: 5030
    closing_silence_samples: 4357
- index: 9
  path: chunks/chunk-009.wav
  sha256: 14eef05784c4a4626581f921ef86d0cdbfbf8b00295d679c64121e3c5fd4107a
  size_bytes: 76844
