  text: Among Muggles
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 47400
    duration_seconds: 1.975
    peak: 0.34421825408935547
    non_silent_samples: 35094
    finite: true
    opening_silence_samples: 856
    closing_silence_samples: 4418
- index: 29
  path: chunks/chunk-029.wav
  sha256: b3136b20e80097679c8c9898b3ffe38aac343851882b27946a5b3a4de69bec56
  size_bytes: 1699244
  kind: paragraph
  ends_block: true
  word_count: 79
  text: Magical and non-magical Britain shared roads, fields, forests, harbours and
    settlements. Before the International Statute of Secrecy, they also shared ordinary
    ways of getting about. Witches, wizards and Muggles travelled in horse-drawn carts
    and sailing ships; in defence, a wizard might use a sword as well as a wand. These
    accounts cover a broad pre-Statute past rather than the founders' particular decade,
    but they place magical people inside historical Britain, not beside it in a sealed
    and parallel country.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 849600
    duration_seconds: 35.4
    peak: 0.3571276068687439
    non_silent_samples: 786455
    finite: true
    opening_silence_samples: 5022
    closing_silence_samples: 4352
- index: 30
  path: chunks/chunk-030.wav
  sha256: b9e61d4c9b407f7dd5747b824f792a294057fbea18c4e384b21973040932cd68
  size_bytes: 1111244
  kind: paragraph
  ends_block: true
  word_count: 58
  text: Shared transport meant shared practical conditions. A cart followed a road;
    a sailing ship depended upon harbours, crews and weather, however much magic might
    ease one part of the passage. Magical travellers did not need a separate system
    for every ordinary task. They could use the same useful thing as their neighbours
    and remain magical while doing so.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 555600
    duration_seconds: 23.15
    peak: 0.35404524207115173
    non_silent_samples: 514657
    finite: true
    opening_silence_samples: 5005
    closing_silence_samples: 4352
- index: 31
  path: chunks/chunk-031.wav
  sha256: c8ecf700383caee31ad30a241bd1c4f65b81f0cc9ff6d2e582a14d1c7799a56b
  size_bytes: 1381244
  kind: paragraph
  ends_block: true
  word_count: 71
  text: 'Even the cauldron once belonged to both populations. Muggles and magical
    people used the same suspended cooking pots before changing household technologies
    left the cauldron chiefly in wizarding hands, still well suited to potion-making
    over a naked flame. The source gives no century for this change and cannot furnish
    the founders'' kitchen. It preserves a smaller history: an ordinary object could
    be shared, adapted and eventually come to look peculiarly magical.'
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 690600
    duration_seconds: 28.775
    peak: 0.44911038875579834
    non_silent_samples: 639780
    finite: true
    opening_silence_samples: 5031
    closing_silence_samples: 4354
- index: 32
  path: chunks/chunk-032.wav
  sha256: d820dd30893caeb54b2f79b44f84ba4ffb3b9e1b19ce2028ba933ad4e6fa7418
  size_bytes: 1351244
  kind: paragraph
  ends_block: true
  word_count: 72
  text: 'The broom belongs to the same mixed landscape. Its rider used magic, but
    the object itself was commonplace enough to hide. Discretion worked through ordinary
    things: a broom that could be put away, a road travelled without display, a remote
    place chosen because repeated magic would be difficult to explain. Muggle observation
    was already a practical concern, though the two populations had not yet been divided
    by the later law of secrecy.'
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 675600
    duration_seconds: 28.15
    peak: 0.38407543301582336
    non_silent_samples: 627288
    finite: true
    opening_silence_samples: 5003
    closing_silence_samples: 4367
- index: 33
  path: chunks/chunk-033.wav
  sha256: fbda1d8757761ca039835726401b97afa4dd0ca6b94e4462cef7799d5cae935a
  size_bytes: 1726844
  kind: paragraph
  ends_block: true
  word_count: 81
  text: Muggle records show how imperfect that discretion could be. Medieval art and
    literature remembered magical creatures while confusing their names and natures.
    One writer known as Brother Benedict described a violent encounter in a herb garden
    with what he took to be a monstrous ferret. Later magical interpretation identifies
    a Jarvey, probably hunting gnomes. A cultivated garden, a magical creature and
    a bewildered observer occupied the same patch of ground; the record kept the incident
    and misunderstood nearly all of it.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 863400
    duration_seconds: 35.975
    peak: 0.364757239818573
    non_silent_samples: 798089
    finite: true
    opening_silence_samples: 5005
    closing_silence_samples: 4349
- index: 34
  path: chunks/chunk-034.wav
  sha256: 3ceaf9584b6f70be00384dc42dea5f2106459168bf65ea551cff5332904faa1b
  size_bytes: 1399244
  kind: paragraph
  ends_block: true
  word_count: 70
  text: Such records show proximity, not easy intimacy. A Muggle might glimpse something
    extraordinary without knowing its name or how it fitted into the larger magical
    world. Magical people possessed names and techniques that their neighbours replaced
    with marvel, monster or mistake. Yet contact was not always hostile. Linfred's
    neighbours sought his remedies without recognising their magical origin. Service,
    curiosity, error and suspicion could all occur within the same shared landscape.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 699600
    duration_seconds: 29.15
    peak: 0.4462416470050812
    non_silent_samples: 647552
    finite: true
    opening_silence_samples: 5022
    closing_silence_samples: 4379
- index: 35
  path: chunks/chunk-035.wav
  sha256: 0df6a175e9b8d590c972deb139a0039059661bc39ebb34231d3886b9d0924bd2
  size_bytes: 1003244
  kind: paragraph
  ends_block: true
  word_count: 48
  text: This was the setting in which magical learning acquired a problem of place.
    A single act of instruction or experiment might pass unnoticed. The repeated gathering
    of magical children, teachers, equipment and practice was harder to hide. Continuity
    needed somewhere to live, but a place made continuity visible.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 501600
    duration_seconds: 20.9
    peak: 0.4067201614379883
    non_silent_samples: 466781
    finite: true
    opening_silence_samples: 5002
    closing_silence_samples: 4354
- index: 36
  path: chunks/chunk-036.wav
  sha256: 577788fbdb7044168f87d222b5ad053c1f298e81f05b1a72b082653d0eddf7bb
  size_bytes: 105644
  kind: section
  ends_block: true
  word_count: 3
  text: Fear and Distance
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 52800
    duration_seconds: 2.2
    peak: 0.33759576082229614
    non_silent_samples: 40297
    finite: true
    opening_silence_samples: 851
    closing_silence_samples: 4378
- index: 37
  path: chunks/chunk-037.wav
  sha256: 5d1634c26bb4e679b0d302ab4ec41547f34e4ee9bc404c3bcfda4015b1cb4484
  size_bytes: 985244
  kind: paragraph
  ends_block: true
  word_count: 51
  text: The strongest founding account places Muggle fear and the persecution of witches
    and wizards beside the choice of a remote site. The founders built away from prying
    eyes. What the account makes plain is that concealment belonged to the castle's
    purpose; it was not a picturesque quality supplied by later legend.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 492600
    duration_seconds: 20.525
    peak: 0.3815118968486786
    non_silent_samples: 457619
    finite: true
    opening_silence_samples: 5001
    closing_silence_samples: 4357
- index: 38
  path: chunks/chunk-038.wav
  sha256: 707b91a4b4c99745091e7cfccd236f3b23dd69563ed2c50a4bfd300efbdd0201
  size_bytes: 1212044
  kind: paragraph
  ends_block: true
  word_count: 60
  text: 'Medieval creature history suggests how fear could spread. Reports of dragons
    and Hippogriffs entered communities poorly equipped to distinguish one magical
    danger from another. A frightening encounter might enlarge suspicion of magic
    and of the people believed to practise it. The dates are broad, but the result
    is familiar enough: incomplete knowledge could make the extraordinary more alarming,
    not less.'
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 606000
    duration_seconds: 25.25
    peak: 0.43406474590301514
    non_silent_samples: 561434
    finite: true
    opening_silence_samples: 5022
    closing_silence_samples: 4357
- index: 39
  path: chunks/chunk-039.wav
  sha256: 8a7f71a2a08021e2e5f58f4aec623cfd1152f9be56c757828f4ef6f74a440829
  size_bytes: 1377644
  kind: paragraph
  ends_block: true
  word_count: 71
  text: Persecution alone does not explain why four practitioners became educators,
    or why their answer took the form of a school. It does explain why that school
    could not safely be merely a large house in a busy settlement. Distance reduced
    casual observation, gave room for repeated practice and allowed magical children
    to gather without every lesson becoming a public demonstration. The castle's situation
    joined educational ambition to the requirements of survival.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 688800
    duration_seconds: 28.7
    peak: 0.4291207492351532
    non_silent_samples: 639594
    finite: true
    opening_silence_samples: 5005
    closing_silence_samples: 4367
- index: 40
  path: chunks/chunk-040.wav
  sha256: a554628fd6f172f5bc9a9c5ff41caad9499a35968596df59149c7dbe7f880715
  size_bytes: 1069244
  kind: paragraph
  ends_block: true
  word_count: 54
  text: Secrecy did not mean isolation. Hogwarts had to remain connected to the society
    it served. Pupils were sought and brought to it; people, messages and supplies
    crossed the distance between the castle and the communities beyond. Remoteness
    controlled access rather than ending it. A hidden school could reach out because
    its centre was protected.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 534600
    duration_seconds: 22.275
    peak: 0.37659841775894165
    non_silent_samples: 497493
    finite: true
    opening_silence_samples: 5005
    closing_silence_samples: 4349
- index: 41
  path: chunks/chunk-041.wav
  sha256: acd94fd7df9c0189512e5379523e1764f40a7991217975f43f273b86aa2ee70f
  size_bytes: 1075244
  kind: paragraph
  ends_block: true
  word_count: 57
  text: 'Safety was not the school''s sole importance. A refuge may preserve people
    for a season; a school must preserve knowledge through repetition. The remote
    site supplied time as well as distance: time for instruction to recur, for errors
    to be corrected and for one group of pupils to be followed by another. The castle
    made continuity material.'
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 537600
    duration_seconds: 22.4
    peak: 0.38508254289627075
    non_silent_samples: 500804
    finite: true
    opening_silence_samples: 5005
    closing_silence_samples: 4354
- index: 42
  path: chunks/chunk-042.wav
  sha256: 845e31038fec9c67e1637170085bfcab0f0677baaf438bce7fb7cb641e11a568
  size_bytes: 102044
  kind: section
  ends_block: true
  word_count: 4
  text: A Place for Learning
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 51000
    duration_seconds: 2.125
    peak: 0.38523513078689575
    non_silent_samples: 38722
    finite: true
    opening_silence_samples: 861
    closing_silence_samples: 4362
- index: 43
  path: chunks/chunk-043.wav
  sha256: cb95583b04c2e8bd75875fda2a2ca290b10c1dfb8cacc9b36e0844c2c46e4f64
  size_bytes: 1045244
  kind: paragraph
  ends_block: true
  word_count: 54
  text: At the threshold of Hogwarts, scattered features become an institution. There
    is a fixed place, more than one accomplished teacher, an intention to seek young
    people showing magic, and a continuing purpose of education. Their deliberate
    combination of place, teachers and pupils was new in consequence, whether or not
    it was unique in form.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 522600
    duration_seconds: 21.775
    peak: 0.40113529562950134
    non_silent_samples: 484291
    finite: true
    opening_silence_samples: 5022
    closing_silence_samples: 4352
- index: 44
  path: chunks/chunk-044.wav
  sha256: be09f08bd2e0c0ec419d0807eaf112ab45942e7a8e56d255f7238f9569eaaaa4
  size_bytes: 1706444
  kind: paragraph
  ends_block: true
  word_count: 83
  text: The castle gave knowledge an address. A craft carried in memory may disappear
    when its keeper dies or withholds it; a practice attached to one household may
    remain local. A school can assemble several practices, repeat instruction and
    retain habits beyond the lives of particular teachers. It can also bring into
    conversation methods that developed apart. Hogwarts did not instantly produce
    the mature curriculum of later centuries, but it created the setting in which
    magical education could acquire a history of its own.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 853200
    duration_seconds: 35.55
    peak: 0.39982298016548157
    non_silent_samples: 788708
    finite: true
    opening_silence_samples: 5000
    closing_silence_samples: 4346
- index: 45
  path: chunks/chunk-045.wav
  sha256: 5d134acc716ee205412426b766369a93d9153bbca615a18badce272a81bab93d
  size_bytes: 1184444
  kind: paragraph
  ends_block: true
  word_count: 59
  text: Recruitment mattered just as much. By seeking children who displayed magic,
    the founders reached beyond their immediate company. The record does not define
    the first catchment or promise that every magical child was found. A child's access
    to teaching no longer depended entirely upon appearing at the right door; the
    new institution accepted some responsibility for finding the pupil.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 592200
    duration_seconds: 24.675
    peak: 0.46272164583206177
    non_silent_samples: 551302
    finite: true
    opening_silence_samples: 5022
    closing_silence_samples: 4354
- index: 46
  path: chunks/chunk-046.wav
  sha256: b8d41ff63a88b0127f2bebe813ec4607f17ccff4e9dea789a9f91f8b8d23c155
  size_bytes: 1290044
  kind: paragraph
  ends_block: true
  word_count: 61
  text: 'Bringing pupils together changed the possibilities of learning. A child could
    observe not only an experienced adult but other learners: their errors, aptitudes
    and different inheritances of knowledge. Teachers could repeat a lesson, discover
    where explanation failed and distinguish an individual difficulty from a common
    one. These are ordinary consequences of collective education, not a recovered
    timetable from the first year.'
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 645000
    duration_seconds: 26.875
    peak: 0.3734855055809021
    non_silent_samples: 598045
    finite: true
    opening_silence_samples: 5024
    closing_silence_samples: 4354
- index: 47
  path: chunks/chunk-047.wav
  sha256: 005dc3e53957368b60c84eba5e2237e8e1fe32ef8d78a58fb6a7eb6dd47cd60a
  size_bytes: 1234844
  kind: paragraph
  ends_block: true
  word_count: 64
  text: The institution also made disagreement durable. Teachers who might once have
    parted had bound their educational purposes to one place and to successive groups
    of children. Their differences now had to be negotiated, expressed in practice
    or allowed to threaten the common enterprise. The offices, customs and divisions
    of later Hogwarts need not be imagined complete at the beginning for that change
    to matter.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 617400
    duration_seconds: 25.725
    peak: 0.3577074408531189
    non_silent_samples: 570584
    finite: true
    opening_silence_samples: 4999
    closing_silence_samples: 4357
- index: 48
  path: chunks/chunk-048.wav
  sha256: e1cbed7b63bb7527c3a7e4e104c3f21f285b501c3663531a88e61e3773162b61
  size_bytes: 1117244
  kind: paragraph
  ends_block: true
  word_count: 52
  text: 'A castle alone does not guarantee an institution''s future, but a durable
    site, active recruitment and repeated instruction made survival beyond the founders
    possible. Once pupils became former pupils, the school could extend through people
    as well as stone: its knowledge, loyalties and disputes returned with them to
    the wider magical community.'
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 558600
    duration_seconds: 23.275
    peak: 0.443403422832489
    non_silent_samples: 517339
    finite: true
    opening_silence_samples: 5021
    closing_silence_samples: 4357
- index: 49
  path: chunks/chunk-049.wav
  sha256: 422c120f6397c9841548b18781b6d56bd0deb56a904fa60c224233098275b4c6
  size_bytes: 1262444
  kind: paragraph
  ends_block: true
  word_count: 58
  text: Nothing in these conditions made Hogwarts inevitable. Broom flight did not
    require a school; Linfred's remedies flourished outside one; Muggle fear did not
    require four particular founders; magical children did not require a castle. The
    institution was one answer to a world of dispersed knowledge, uneven access and
    dangerous visibility. It became historically decisive because that answer endured.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 631200
    duration_seconds: 26.3
    peak: 0.42448195815086365
    non_silent_samples: 587804
    finite: true
    opening_silence_samples: 5031
    closing_silence_samples: 4352
- index: 50
  path: chunks/chunk-050.wav
  sha256: fec95f223f78fd13a64835223a49f05fdb237e0646fb0970b3a64767b77c6cb6
  size_bytes: 1324844
  kind: paragraph
  ends_block: true
  word_count: 76
  text: Only at this point do the four founders properly enter the history. Their
    later fame makes their cooperation appear natural and their divisions foreseeable.
    Neither impression should be trusted without examination. The world that made
    their school significant can now be seen in outline; the next question is who
    they were, what purposes they brought to the undertaking, and how much of their
    familiar character belongs to evidence rather than to the long memory of Hogwarts.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 662400
