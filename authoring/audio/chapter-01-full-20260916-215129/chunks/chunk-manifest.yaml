  text: Old Arts
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 38400
    duration_seconds: 1.6
    peak: 0.25855281949043274
    non_silent_samples: 27706
    finite: true
    opening_silence_samples: 3271
    closing_silence_samples: 4309
- index: 10
  path: chunks/chunk-010.wav
  sha256: 945d5914671fdf7ad0bdd15897f125b346d6a84c0db1e011e1077ca11bbbfdee
  size_bytes: 1212044
  kind: paragraph
  ends_block: true
  word_count: 66
  text: Among the oldest things at Hogwarts is an object that was old before the school
    existed. The Hogwarts Pensieve is made of ornately carved stone and engraved with
    modified Saxon runes. It is older than the castle that now contains it. The runes
    are features of that ancient artefact; their engraving is not independently dated,
    and the account does not say that they performed any magic.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 606000
    duration_seconds: 25.25
    peak: 0.33603930473327637
    non_silent_samples: 564171
    finite: true
    opening_silence_samples: 5022
    closing_silence_samples: 4349
- index: 11
  path: chunks/chunk-011.wav
  sha256: adeecac9921c596423b67b6d3ca1a3ab79c5238faed862b29a5dd072a25ed90b
  size_bytes: 1276844
  kind: paragraph
  ends_block: true
  word_count: 72
  text: 'The Pensieve acquired a story equal to its age. One tradition says that the
    founders found it half-buried on the very spot where they chose to build. It is
    a fine story, but no record confirms it. The Pensieve''s age does not prove that
    the founders found it there. What survives is still remarkable enough: an ancient
    magical object of carved stone bearing modified Saxon runes endured into the institution
    that followed.'
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 638400
    duration_seconds: 26.6
    peak: 0.40699484944343567
    non_silent_samples: 593322
    finite: true
    opening_silence_samples: 5003
    closing_silence_samples: 4379
- index: 12
  path: chunks/chunk-012.wav
  sha256: 6d3c21313f04e003c3f87f88328580cc1329918e12cb65ed7a59b1648b1e2310
  size_bytes: 2055644
  kind: paragraph
  ends_block: true
  word_count: 100
  text: Another old craft comes to us by way of a less dignified object. A European
    manuscript records witches and wizards using flying broomsticks in 962. The early
    broom offered one forward speed and the ability to rise, descend and stop. It
    was uncomfortable, limited and unlikely to inspire nostalgia in anyone required
    to travel far upon it. It nevertheless shows an everyday magical technology in
    use and still being improved in the broad age from which Hogwarts emerged. The
    uncertain date of the school's foundation prevents us from saying whether the
    record falls just before or just after its opening.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 1027800
    duration_seconds: 42.825
    peak: 0.40806299448013306
    non_silent_samples: 954619
    finite: true
    opening_silence_samples: 5022
    closing_silence_samples: 4334
- index: 13
  path: chunks/chunk-013.wav
  sha256: fcf718b8b9a9b50c766e7f0d2274c13396e9aa55acb8a6c8de1e5d9f93622d9c
  size_bytes: 1664444
  kind: paragraph
  ends_block: true
  word_count: 86
  text: The broom also joined travel to discretion. Unlike a conspicuous flying beast,
    it could be hidden without much difficulty, an advantage recognised long before
    secrecy became an international body of law. Timber had to be chosen, worked and
    charmed; controls had to answer reliably enough for a rider to trust them. The
    manuscript does not name the makers or their teachers, but a repeatable device
    already in use is evidence of knowledge passing between hands. Solitary inspiration
    may produce a marvel. A working craft requires memory.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 832200
    duration_seconds: 34.675
    peak: 0.4369945228099823
    non_silent_samples: 762315
    finite: true
    opening_silence_samples: 5003
    closing_silence_samples: 4359
- index: 14
  path: chunks/chunk-014.wav
  sha256: b35c4d3ecec489068c371490237b0a2a455c13880df249d372ad13bc7dead167
  size_bytes: 1688444
  kind: paragraph
  ends_block: true
  word_count: 86
  text: Wandcraft carries a longer tradition, though not so tidy a chronology. The
    Ollivander shop sign claims a family wandmaking history from 382 BC. The present
    Mr Ollivander also believes that his ancestors reached Britain with the Romans
    and sold crafted wands to British wizards whose own instruments were crude and
    unreliable. The shop's date is a public tradition, and the Roman story a descendant's
    belief; neither is an unbroken ledger from antiquity. Both preserve the memory
    of wandmaking as a craft with a history outside Hogwarts.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 844200
    duration_seconds: 35.175
    peak: 0.3409833014011383
    non_silent_samples: 777335
    finite: true
    opening_silence_samples: 5031
    closing_silence_samples: 4334
- index: 15
  path: chunks/chunk-015.wav
  sha256: 1df8391490afd04b7ca804b081602e47bf9fafd96f54bbfeeb4ed2f9e4bba0b1
  size_bytes: 1350044
  kind: paragraph
  ends_block: true
  word_count: 72
  text: 'The medieval record is firmer. Geraint Ollivander was a celebrated wandmaker
    whose written observations survived in later family practice. The wood itself
    demanded knowledge: only a minority of trees yield timber fit for a wand, and
    recognising them takes long experience. Bowtruckles may direct a trained eye towards
    a promising tree. Plant lore, creature lore and the maker''s judgement thus met
    at the workbench before the wand performed any magic at all.'
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 675000
    duration_seconds: 28.125
    peak: 0.4533219337463379
    non_silent_samples: 624606
    finite: true
    opening_silence_samples: 5003
    closing_silence_samples: 4354
- index: 16
  path: chunks/chunk-016.wav
  sha256: 3b7de88d8fb5f32016bf5a8311fd82d904885591808ea0d7c0b794cfa5d9c3b6
  size_bytes: 1249244
  kind: paragraph
  ends_block: true
  word_count: 59
  text: Creature knowledge survives differently. Dragons, griffins, unicorns, phoenixes
    and centaurs entered medieval Muggle art and writing, often in forms that would
    have dismayed a competent magizoologist. Their appearance records encounters,
    reports and memories strong enough to cross from magical nature into non-magical
    culture. A creature need not be correctly classified to become part of the knowledge
    of an age.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 624600
    duration_seconds: 26.025
    peak: 0.44782862067222595
    non_silent_samples: 580114
    finite: true
    opening_silence_samples: 5005
    closing_silence_samples: 4352
- index: 17
  path: chunks/chunk-017.wav
  sha256: 13dd115cf8969f8e87da2e292226898b8bd83540bf272aa0f273cdcf3db57d5b
  size_bytes: 1078844
  kind: paragraph
  ends_block: true
  word_count: 59
  text: These remains do not add up to an early timetable. They show a culture of
    use. People carved stone, worked wood and magical materials, flew, carried wands,
    improved tools and learnt the habits of dangerous creatures. Hogwarts would eventually
    arrange many kinds of knowledge under one roof. It did not create the world on
    which that roof was raised.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 539400
    duration_seconds: 22.475
    peak: 0.3340861201286316
    non_silent_samples: 502004
    finite: true
    opening_silence_samples: 5002
    closing_silence_samples: 4362
- index: 18
  path: chunks/chunk-018.wav
  sha256: f2d35080d20ba18a19e0eafa6869863d2aae2ffe075513720fe0bf24ec29e1a6
  size_bytes: 104444
  kind: section
  ends_block: true
  word_count: 3
  text: Knowledge in Use
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 52200
    duration_seconds: 2.175
    peak: 0.36176639795303345
    non_silent_samples: 39617
    finite: true
    opening_silence_samples: 891
    closing_silence_samples: 4355
- index: 19
  path: chunks/chunk-019.wav
  sha256: f857d786c8d9f63b58d2ba7d466d055c038e382514f62f64b90a9dd81e30bf73
  size_bytes: 1335644
  kind: paragraph
  ends_block: true
  word_count: 75
  text: Craft implies teaching in the broadest sense, though not necessarily a profession
    of teachers. A maker must learn why one piece of wood answers and another fails.
    A rider must learn how to rise and, more urgently, how to stop. Written observations
    such as Geraint Ollivander's preserved part of a craft; tools, demonstrations
    and failed attempts preserved other parts. Knowledge could pass through a family,
    a workshop or a neighbour without producing a school register.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 667800
    duration_seconds: 27.825
    peak: 0.35947751998901367
    non_silent_samples: 619111
    finite: true
    opening_silence_samples: 5022
    closing_silence_samples: 4372
- index: 20
  path: chunks/chunk-020.wav
  sha256: be4c48981a3523d5c9946c6e06511154705b59be92a4433dec786e7858ff2d24
  size_bytes: 1321244
  kind: paragraph
  ends_block: true
  word_count: 67
  text: Learning of this kind did not separate itself neatly from work. Selecting
    timber, tending a garden, preparing a remedy or assisting an experienced hand
    could all provide instruction without becoming a formal lesson. An old object
    might preserve decisions its maker never wrote down; an unsuccessful broom might
    teach balance in a particularly memorable fashion. Such means were local and uneven,
    but skill could accumulate through them.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 660600
    duration_seconds: 27.525
    peak: 0.39225441217422485
    non_silent_samples: 614269
    finite: true
    opening_silence_samples: 5018
    closing_silence_samples: 4354
- index: 21
  path: chunks/chunk-021.wav
  sha256: dfdb9ceb9dd9a1dec6da2d39565afc9aa48ad4c61ba3f72eeff87eeacb0f071e
  size_bytes: 1365644
  kind: paragraph
  ends_block: true
  word_count: 65
  text: Potioneering belonged to this practical world, but its earliest British history
    is obscure. No direct evidence establishes ordinary household potion-making in
    tenth-century Britain. Two centuries later, however, Linfred of Stinchcombe cultivated
    unusual plants, experimented behind closed doors and supplied medicinal help to
    Muggle neighbours, who took him for an eccentric but useful gardener. His home
    was at once garden, workshop and local source of healing.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 682800
    duration_seconds: 28.45
    peak: 0.382824182510376
    non_silent_samples: 632800
    finite: true
    opening_silence_samples: 5021
    closing_silence_samples: 4367
- index: 22
  path: chunks/chunk-022.wav
  sha256: 22289b323b240f486cc7b65ab06d16aaa8291a249972b67dc6647a15ef3cbfb8
  size_bytes: 1264844
  kind: paragraph
  ends_block: true
  word_count: 63
  text: Wizarding historians credit Linfred with remedies that developed into potions
    still known in later centuries, including the ancestors of Skele-gro and Pepperup
    Potion. He sold his cures to other witches and wizards as well as quietly treating
    his neighbours. His preparations therefore travelled beyond Stinchcombe, although
    the account does not reveal whether he wrote down his methods, demonstrated them
    or guarded them closely.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 632400
    duration_seconds: 26.35
    peak: 0.3807184100151062
    non_silent_samples: 589356
    finite: true
    opening_silence_samples: 5022
    closing_silence_samples: 4367
- index: 23
  path: chunks/chunk-023.wav
  sha256: e02a305a0982563159409f991388dd9153a9eafe236271bbb569dc9e6a5abdb5
  size_bytes: 1290044
  kind: paragraph
  ends_block: true
  word_count: 72
  text: Linfred is not a witness to the founders' century. He lived in the twelfth
    century, when Hogwarts was already established. Yet that later date makes him
    instructive in a different way. The castle had not swallowed every useful plant,
    healing practice or new preparation within its walls. A wizard could work at home,
    serve a local community and contribute lasting remedies to magical practice. Hogwarts
    never possessed a monopoly on useful knowledge.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 645000
    duration_seconds: 26.875
    peak: 0.3818781077861786
    non_silent_samples: 597893
    finite: true
    opening_silence_samples: 5022
    closing_silence_samples: 4352
- index: 24
  path: chunks/chunk-024.wav
  sha256: 9a3ee69268c29f0f078944d1dd3a9660bfa40b67cae0715fbecf908ea66152c2
  size_bytes: 1195244
  kind: paragraph
  ends_block: true
  word_count: 57
  text: His garden belongs beside the wandmaker's woodpile. Linfred cultivated unusual
    plants for remedies; wandmakers learnt which rare trees yielded good timber and
    watched for the Bowtruckles that inhabited them. Gardens, woods and workshops
    did not observe the borders later drawn between Herbology, Potions, the study
    of creatures and wandcraft. Useful knowledge met where the work required it.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 597600
    duration_seconds: 24.9
    peak: 0.39494001865386963
    non_silent_samples: 553233
    finite: true
    opening_silence_samples: 5002
    closing_silence_samples: 4379
- index: 25
  path: chunks/chunk-025.wav
  sha256: 0c0459f01076730f838ca315ff7a74b8fd3bcfa8b31b7449d07af1347795d67e
  size_bytes: 1345244
  kind: paragraph
  ends_block: true
  word_count: 76
  text: Stories carried another kind of knowledge. In later centuries, tales associated
    with Beedle became familiar bedtime reading, and one well-known story taught many
    wizarding children that magic could not reverse death. No spell was learnt from
    that lesson, yet a limit upon magical action was. Beedle cannot be placed in the
    homes of the founders' first pupils, but his later reception shows how a magical
    culture may pass on judgement and restraint as well as technique.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 672600
    duration_seconds: 28.025
    peak: 0.3481551706790924
    non_silent_samples: 623276
    finite: true
    opening_silence_samples: 5026
    closing_silence_samples: 4357
- index: 26
  path: chunks/chunk-026.wav
  sha256: 5786c2634ae6c225b71d6e7e2b28b4e1891ed53620f299f95042233ac713084c
  size_bytes: 1336844
  kind: paragraph
  ends_block: true
  word_count: 75
  text: The weakness of scattered teaching is easy to see. Knowledge held by one family,
    craft or gifted healer could travel only as far as its keepers and circumstances
    allowed. A child born near accomplished practitioners stood in a different position
    from one whose magic appeared where little help was at hand. The record gives
    no measure of that inequality, but the founders' decision to seek children rather
    than wait for them is intelligible against it.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 668400
    duration_seconds: 27.85
    peak: 0.39466536045074463
    non_silent_samples: 618894
    finite: true
    opening_silence_samples: 5003
    closing_silence_samples: 4379
- index: 27
  path: chunks/chunk-027.wav
  sha256: f7cadcf483318e4a30af943932f4c15523840e48261a7572cd7ff7e69710b4e3
  size_bytes: 1220444
  kind: paragraph
  ends_block: true
  word_count: 69
  text: Hogwarts thus arose from a world in which magical knowledge was real, consequential
    and dispersed. Some of it belonged to stone or tools; some to skilled hands, gardens
    and written craft lore; some to stories and cautions. The school created a place
    in which much of it could be taught repeatedly. The hands and households that
    possessed it, however, belonged to the same British landscape as their Muggle
    neighbours.
  audio:
    sample_rate: 24000
    channels: 1
    sample_count: 610200
    duration_seconds: 25.425
    peak: 0.37022003531455994
    non_silent_samples: 565472
    finite: true
    opening_silence_samples: 5020
    closing_silence_samples: 4357
- index: 28
  path: chunks/chunk-028.wav
  sha256: 90a68aaaef68382ac6bdfae2b8c0d3869edac8ebac26603af8868fea09725e96
  size_bytes: 94844
