last_completed_source_unit:
  source_file: pdfs/harrypotter.pdf
  book_group: book-04
  book: Harry Potter and the Goblet of Fire
  chapter_number: 11
  chapter_title: Chapter Eleven - Aboard the Hogwarts Express
  page_start: 1078
  page_end: 1088
  output_yaml: sources/book-04/chapter-11-aboard-the-hogwarts-express.yaml
current_source_unit:
  source_file: pdfs/harrypotter.pdf
  book_group: book-04
  book: Harry Potter and the Goblet of Fire
  chapter_number: 12
  chapter_title: Chapter Twelve - The Triwizard Tournament
  page_start: 1089
  page_end: 1106
