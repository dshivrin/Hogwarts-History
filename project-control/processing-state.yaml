project:
  mode: minimal_context
  canonical_runtime_contract: docs/instructions/runtime-contract.md
  schema_reference: docs/instructions/schema-reference.md
  background_guide: docs/instructions/background-guide.md
last_completed_source_unit:
  source_file: pdfs/harrypotter.pdf
  book_group: book-06
  book: Harry Potter and the Half-Blood Prince
  chapter_number: 30
  chapter_title: Chapter Thirty - The White Tomb
  page_start: 2949
  page_end: 2964
  output_yaml: sources/book-06/chapter-30-the-white-tomb.yaml
current_source_unit:
  source_file: pdfs/harrypotter.pdf
  book_group: book-07
  book: Harry Potter and the Deathly Hallows
  chapter_number: 1
  chapter_title: Chapter One - The Dark Lord Ascending
  page_start: 2976
  page_end: 2985
  output_yaml: sources/book-07/chapter-01-the-dark-lord-ascending.yaml
  extracted_text_path: .tmp/current-chapter.txt
next_source_unit:
  source_file: pdfs/harrypotter.pdf
  book_group: book-07
  book: Harry Potter and the Deathly Hallows
  chapter_number: 2
  chapter_title: Chapter Two - In Memoriam
  page_start: 2986
  page_end: 2997
  output_yaml: sources/book-07/chapter-02-in-memoriam.yaml
indexes:
  duplicate_index: project-control/duplicate-index.yaml
  entry_index: project-control/entry-index.yaml
  source_index: project-control/source-index.yaml
  tag_index: project-control/tag-index.yaml
appendices:
  generated_only: true
  generator_script: scripts/generate_appendices.py
  structured_sources:
    open_questions: project-control/structured-sources/open-questions.yaml
cache:
  current_text: .tmp/current-chapter.txt
  keep_last_n_chapters: 3
automation_rules:
  process_one_unit_per_run: true
  never_scan_full_pdf_if_anchor_exists: true
  prefer_forward_pending_over_backfill: true
  update_next_run_file: true
  advance_to_next_chapter: true
  stop_on_schema_error: true
cleanup_runs:
- date: '2026-06-20'
  type: appendix_consolidation
  scope: Consolidated append-only PoA Chapter Eight through Chapter Twenty-One additions
    into cumulative Emerging Parts sections without processing a new source unit.
  source_units_newly_processed: 0
  next_pending_preserved: true
