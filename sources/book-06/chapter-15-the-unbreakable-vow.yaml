    quote_excerpt_short: "the usual twelve Christmas trees for the Great Hall"
    source_note: Hogwarts Christmas decoration is again described as a recurring custom, with Hagrid delivering twelve Great Hall trees, holly and tinsel on stair banisters, candles in armor, mistletoe in corridors, and secret passages used as alternate routes.
    reference_type: institutional_custom
