      local_occurrence_note: The chapter opens with the castle decorated for Christmas and Harry using secret routes to avoid corridor blockages.
    nearby_context: Hagrid has already brought the Great Hall trees, while corridors and stair banisters are decorated before the holiday break.
    match_terms:
