    text_anchor:
      start_phrase: The distribution of class schedules was more complicated than usual this year
      end_phrase: I shall pass the list to you in due course
      local_occurrence_note: McGonagall confirms sixth-year students' O.W.L. results before issuing N.E.W.T. timetables and Quidditch captain materials.
    nearby_context: After breakfast on the first full school day, students wait in the Great Hall while McGonagall checks subject eligibility and prepares schedules.
    match_terms:
      - class schedules
      - O.W.L. grades
      - N.E.W.T.s
      - Professor McGonagall
      - Head of House
      - Potions
      - Auror
    quote_excerpt_short: "necessary O.W.L. grades to continue"
    source_note: McGonagall checks each student's O.W.L. results against subject requirements before issuing sixth-year N.E.W.T. schedules, including different Potions thresholds under Snape and Slughorn.
    reference_type: curriculum_or_subject
    era_classification: harry_era_confirmation
    topic_tags:
      - ordinary-wizarding-levels
      - newt-courses
      - class-schedules
      - head-of-house
      - academic-progression
      - potions
      - auror
    candidate_part: Academic Life and Curriculum
    candidate_chapter: Exams and Assessment
    candidate_section: O.W.L. thresholds and N.E.W.T. course placement
    reason_for_placement: The passage turns exam results into observed course-placement procedure, showing Head-of-House advising and teacher-specific subject thresholds.
    relevance_to_hogwarts_a_history: This is strong evidence for how Hogwarts converts public exam marks into sixth-year timetables and career-relevant N.E.W.T. access.
    duplicate_check:
      possible_duplicate: true
      duplicate_of:
        - hbp-ch05-007
      notes: hbp-ch05-007 records post-O.W.L. Head-of-House advice and career thresholds; this entry adds the actual first-day N.E.W.T. schedule assignment process and Slughorn's lower Potions admission threshold.
    confidence: high
    limitations: The passage shows Gryffindor advising examples and does not establish whether every department sets thresholds independently every year.

