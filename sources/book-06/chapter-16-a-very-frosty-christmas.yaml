    candidate_section: Consequences of the Unbreakable Vow
    reason_for_placement: The passage adds the known consequence of breaking the oath and shows that the danger was recognized in wizarding families outside formal school instruction.
    relevance_to_hogwarts_a_history: A later edition can use this as context for Draco Malfoy's sixth-year mission and for magical obligations that lie beyond ordinary school discipline.
    duplicate_check:
