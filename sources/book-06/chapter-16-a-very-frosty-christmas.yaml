      end_phrase: "You die"
      local_occurrence_note: Ron corrects Harry's term to Unbreakable Vow, explains that it cannot be broken, and recalls the twins' childhood attempt to make him swear one.
    nearby_context: Harry and Ron are discussing what Harry overheard between Snape and Draco after Slughorn's Christmas party.
