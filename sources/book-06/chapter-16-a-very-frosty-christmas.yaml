    quote_excerpt_short: "you can't break an Unbreakable Vow"
    source_note: Ron supplies household-level magical knowledge that an Unbreakable Vow is lethal if broken and serious enough that Arthur reacted furiously when Fred and George nearly induced Ron to make one as a child.
    reference_type: explicit_in_universe_source
