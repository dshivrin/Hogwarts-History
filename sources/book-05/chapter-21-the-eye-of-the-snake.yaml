      start_phrase: Yeah, I was gonna tell yeh how come we got a herd
      end_phrase: the results of your inspection
      local_occurrence_note: Umbridge interrupts Hagrid's explanation of the thestral herd, invokes Ministry classification, and distorts student answers in her inspection notes.
    nearby_context: Hagrid says the herd began with one male and five females and names Tenebrus as the first born in the forest before Umbridge records prejudicial notes.
    match_terms:
      - High Inquisitor
