      - Hagrid
      - thestrals
      - Ministry classification
      - dangerous creatures
      - Tenebrus
    quote_excerpt_short: "classified thestrals as dangerous"
    source_note: Umbridge's inspection combines Ministry dangerous-creature classification with hostile scrutiny of Hagrid's speech, memory, and lesson control, while Hagrid gives founding details for the school herd.
    reference_type: school_rule_or_policy
    era_classification: later_editorial_note
    topic_tags:
      - high-inquisitor
      - staff-inspections
      - hagrid
      - thestrals
      - ministry-classification
      - magical-creatures
      - prejudice
    candidate_part: Later Editorial Notes
    candidate_chapter: Headmasters and School Authority
    candidate_section: High Inquisitor inspections and Care of Magical Creatures
    reason_for_placement: The passage shows Ministry inspection authority being applied to a live creature lesson and records the interaction between official creature classifications and staff evaluation.
    relevance_to_hogwarts_a_history: A later edition can use this as a concrete example of Umbridge-era oversight shaping classroom treatment of both curriculum and teacher status.
    duplicate_check:
      possible_duplicate: true
      duplicate_of:
        - ootp-ch20-006
        - ootp-ch15-006
        - ootp-ch15-001
      notes: ootp-ch20-006 records Umbridge warning Hagrid of inspection, ootp-ch15-006 records Grubbly-Plank's inspected creature syllabus, and ootp-ch15-001 records the High Inquisitor office; this entry adds the actual thestral inspection and Ministry dangerous classification.
    confidence: high
    limitations: Umbridge's written report is not shown, only the notes she mutters and the promised result in ten days.

