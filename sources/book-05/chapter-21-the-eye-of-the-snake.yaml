    extracted_text_lines: 128-174
    text_anchor:
      start_phrase: Thestrals
      end_phrase: ten points ter Gryffindor
      local_occurrence_note: Hagrid reveals the invisible winged horses as thestrals, explains their visibility rule, and describes their Hogwarts role.
    nearby_context: Only Harry, Neville, and one Slytherin boy appear able to see the creatures clearly while the rest of the class sees meat vanish from the carcass.
    match_terms:
      - thestrals
      - Hogwarts herd
      - school carriages
      - death
      - Hagrid
      - Dumbledore
      - Forbidden Forest
    quote_excerpt_short: "Hogwarts has got a whole herd"
    source_note: The lesson confirms that Hogwarts keeps a thestral herd in the Forbidden Forest, uses them mainly to pull school carriages, and that only people who have seen death can see them.
    reference_type: magical_architecture
    era_classification: harry_era_confirmation
    topic_tags:
      - thestrals
      - forbidden-forest
      - school-carriages
      - death-witnesses
      - hagrid
      - dumbledore
      - student-transport
    candidate_part: Magical Architecture and Enchantments
    candidate_chapter: Grounds, Transport, and the Forbidden Forest
    candidate_section: Thestrals, carriage teams, and death-sight visibility
    reason_for_placement: The passage identifies the otherwise unseen carriage creatures, their home range, their school function, and the magical condition for perceiving them.
    relevance_to_hogwarts_a_history: A later edition can connect ordinary arrival transport with the hidden magical population maintained in the school grounds.
    duplicate_check:
      possible_duplicate: true
      duplicate_of:
        - ootp-ch14-002
        - ootp-ch20-007
        - gof-ch11-006
      notes: ootp-ch14-002 identifies the unseen carriage creatures near the forest, ootp-ch20-007 anticipates Hagrid's unnamed domestic herd, and gof-ch11-006 records the carriage route; this entry names the herd as thestrals and adds the death-sight rule.
    confidence: high
    limitations: The lesson does not give a full herd count beyond the founding stock and observed individuals.

