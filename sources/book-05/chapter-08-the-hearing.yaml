  candidate_part: Rules, Discipline, and Governance
  candidate_chapter: Ministry Law and School-Age Wizards
  candidate_section: Old Courtroom Ten and Wizengamot Procedure
  reason_for_placement: The old courtroom links student discipline to Ministry judicial spaces and gives architectural detail for a legal setting already tied to First Wizarding War trials.
  relevance_to_hogwarts_a_history: A later edition can use this as evidence for how Hogwarts-connected cases could be pulled into older Ministry courtrooms during wider political crises.
  duplicate_check:
    possible_duplicate: true
    duplicate_of:
    - gof-ch30-003
    - ootp-ch07-007
    notes: gof-ch30-003 records the same courtroom in Pensieve memory and ootp-ch07-007 records the venue change to old Courtroom Ten; this entry adds the present-day Wizengamot seating, robes, and current use in Harry's hearing.
  confidence: high
