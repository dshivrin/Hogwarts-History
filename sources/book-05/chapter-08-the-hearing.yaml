  - Lestranges
  - Azkaban
  - plum robes
  quote_excerpt_short: "the arms of which were covered in chains"
  source_note: The chapter confirms old Courtroom Ten as a still-usable Ministry judicial chamber with dark-stone architecture, tiered benches, a chained restraint chair, and Wizengamot members in marked robes.
  reference_type: magical_architecture
  era_classification: later_editorial_note
  topic_tags:
