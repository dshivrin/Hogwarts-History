  text_anchor:
    start_phrase: The large dungeon he had entered
    end_phrase: plum-colored robes with an elaborately worked silver W
    local_occurrence_note: Harry recognizes old Courtroom Ten from Dumbledore's Pensieve memory and sees the chained chair, dark stone, torches, tiered benches, and Wizengamot robes.
  nearby_context: The hearing opens in the same underground courtroom where Harry previously saw the Lestranges sentenced, now used for his underage-magic case.
