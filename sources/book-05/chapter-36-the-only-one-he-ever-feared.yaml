  text_anchor:
    start_phrase: Where's the exit?
    end_phrase: he was rising
    local_occurrence_note: Harry asks the rotating Department antechamber for the exit and is given a direct corridor to the lifts, then takes a lift marked Atrium.
  nearby_context: Bellatrix has fled from the Death Chamber through the Brain Room, and Harry is pursuing her alone through the Department of Mysteries.
  match_terms:
  - Department of Mysteries
  - rotating room
  - exit
  - lifts
  - Atrium
  - navigation
  quote_excerpt_short: "The door right behind him flew open"
  source_note: The Department's rotating antechamber can expose the correct exit route in response to a direct request, leading from the research rooms back to the lift corridor and Atrium.
  reference_type: magical_architecture
  era_classification: later_editorial_note
  topic_tags:
  - department-of-mysteries
  - rotating-room
  - magical-architecture
  - navigation
  - lifts
  - atrium
  - ministry-of-magic
  candidate_part: Later Editorial Notes
  candidate_chapter: Ministry Interfaces and Magical Research
  candidate_section: Rotating-room navigation and exit behavior
  reason_for_placement: The scene adds an observed escape behavior to the Department's earlier disorienting architecture.
  relevance_to_hogwarts_a_history: A later edition can compare Ministry wayfinding enchantments with Hogwarts's own shifting staircases, doors, and concealed routes.
  duplicate_check:
    possible_duplicate: true
    duplicate_of:
    - ootp-ch34-003
    notes: ootp-ch34-003 establishes the rotating antechamber as disorienting architecture; this entry adds that the room can reveal the exit corridor on request during a crisis.
  confidence: high
  limitations: The mechanism's rules are not explained, and the response may depend on Harry's circumstances rather than normal visitor access.

