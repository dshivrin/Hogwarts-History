  candidate_part: Later Editorial Notes
  candidate_chapter: The Second War and Hogwarts Information Climate
  candidate_section: The Quibbler interview reaches the Great Hall
  reason_for_placement: The passage shows alternative wartime media entering school life and changing student and public discourse.
  relevance_to_hogwarts_a_history: A later edition can use this to show how external wizarding publications and owl post shaped Hogwarts information networks during Ministry censorship.
  duplicate_check:
