  extracted_text_lines: 14-16; 24-54
  text_anchor:
    start_phrase: Hasn't anyone told you?
    end_phrase: and the scrolls vanished
    local_occurrence_note: Sirius identifies Grimmauld Place as his inherited family house offered to Dumbledore, while Bill and Mrs. Weasley rapidly hide meeting parchments including a building plan.
  nearby_context: Harry enters the basement kitchen just after an Order meeting, sees rolls of parchment and a possible building plan, and watches Bill vanish the scrolls after Mrs. Weasley notices Harry looking.
  match_terms:
  - Grimmauld Place
  - headquarters
  - Black family
  - Dumbledore
  - building plan
  - Evanesco
  quote_excerpt_short: "I offered it to Dumbledore for headquarters"
  source_note: The chapter confirms number twelve, Grimmauld Place as Sirius Black's inherited house and Order headquarters, with meeting documents treated as confidential immediately after Harry arrives.
  reference_type: security_or_protection
  era_classification: later_editorial_note
  topic_tags:
  - grimmauld-place
  - order-of-the-phoenix
  - headquarters
  - black-family
  - operational-secrecy
  - dumbledore
  candidate_part: Protective Magic and Security
  candidate_chapter: Headquarters, Safe Houses, and Secret-Keeping
  candidate_section: Grimmauld Place as Inherited Order Headquarters
  reason_for_placement: The passage connects a private pure-blood family house to Dumbledore's wartime organization and shows practical document secrecy at headquarters.
  relevance_to_hogwarts_a_history: A later edition can use this as evidence that Dumbledore's Second War network operated from an inherited Black-family property rather than a school or Ministry site.
  duplicate_check:
    possible_duplicate: true
    duplicate_of:
    - ootp-ch04-001
    - ootp-ch04-004
    notes: ootp-ch04-001 records the hidden building's reveal and ootp-ch04-004 defines the Order's headquarters meetings; this entry adds Sirius's ownership and the immediate handling of confidential meeting papers.
  confidence: high
  limitations: The visible plan is not identified, and the chapter does not reveal the meeting agenda.

