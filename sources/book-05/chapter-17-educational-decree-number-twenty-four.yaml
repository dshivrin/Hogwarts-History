    extracted_text_lines: 33-61
    text_anchor:
      start_phrase: A large sign had been affixed to the Gryffindor notice board
      end_phrase: in accordance with Educational Decree Number Twenty-four
      local_occurrence_note: The new High Inquisitor notice covers the Gryffindor notice board on Monday morning.
    nearby_context: The notice replaces ordinary common-room notices about books, school rules, Quidditch practice, Hogsmeade weekends, advertisements, and lost property.
    match_terms:
      - Educational Decree Number Twenty-four
      - High Inquisitor
      - student organizations
      - clubs
      - teams
      - expulsion
    quote_excerpt_short: "All Student Organizations, Societies, Teams, Groups, and Clubs are henceforth disbanded."
    source_note: Educational Decree Number Twenty-four disbands all student organizations, defines them as regular meetings of three or more students, requires High Inquisitor approval to reform, and threatens expulsion for unauthorized membership.
    reference_type: school_rule_or_policy
    era_classification: later_editorial_note
    topic_tags:
      - educational-decrees
      - high-inquisitor
      - student-organizations
      - clubs
      - teams
      - school-governance
      - expulsion
    candidate_part: Later Editorial Notes
    candidate_chapter: Headmasters and School Authority
    candidate_section: Educational Decree Number Twenty-four and student organizations
    reason_for_placement: The passage gives the text and practical scope of a Ministry-era decree controlling student association inside Hogwarts.
    relevance_to_hogwarts_a_history: A later edition could cite this as the clearest example of the High Inquisitor's authority extending from staff inspection to student clubs, teams, and informal groups.
    duplicate_check:
      possible_duplicate: true
      duplicate_of: ootp-ch15-001
      notes: ootp-ch15-001 records the creation of the High Inquisitor office and inspection authority; this entry adds the later decree disbanding student organizations and setting an expulsion penalty.
    confidence: high
    limitations: The decree is an exceptional Harry-era Ministry intervention and should not be generalized as ordinary Hogwarts club policy.

