    extracted_text_lines: 6-57
    text_anchor:
      start_phrase: He was finding it almost impossible to fix a regular night
      end_phrase: How come you're not in Ravenclaw?
      local_occurrence_note: Harry reviews recent D.A. progress, then Hermione explains the fake Galleons at the end of the fourth meeting.
    nearby_context: The D.A. avoids predictable meeting times because Quidditch practices shift and because cross-House communication would look suspicious under Umbridge.
    match_terms:
      - D.A.
      - fake Galleons
      - Protean Charm
      - N.E.W.T. standard
      - Umbridge
      - cross-House
      - meeting schedule
    quote_excerpt_short: "the numbers will change to reflect the time and date"
    source_note: Hermione's fake Galleons provide a covert cross-House scheduling system for the illegal D.A.; the coins use a Protean Charm, identified by Terry Boot as N.E.W.T.-standard magic.
    reference_type: security_or_protection
    era_classification: later_editorial_note
    topic_tags:
      - da-meetings
      - communication-security
      - protean-charm
      - fake-galleons
      - student-organizations
      - cross-house-cooperation
      - defense-against-the-dark-arts
    candidate_part: Later Editorial Notes
    candidate_chapter: Protective Magic and Security
    candidate_section: Covert student communication under the High Inquisitor
    reason_for_placement: The passage shows students adapting ordinary objects and advanced magic to communicate despite surveillance and restrictions on organized groups.
    relevance_to_hogwarts_a_history: A later edition can use this as a concrete example of how school resistance operated within Hogwarts spaces during Ministry control.
    duplicate_check:
      possible_duplicate: true
      duplicate_of:
        - ootp-ch17-001
        - ootp-ch17-003
      notes: ootp-ch17-001 records the decree disbanding student organizations and ootp-ch17-003 records watched communications; this entry adds the D.A.'s enchanted-coin workaround.
    confidence: high
    limitations: The method is student-created and exceptional to the D.A.; it is not an official Hogwarts communication system.

