  candidate_section: Portable swamp aftermath and staff noncooperation
  reason_for_placement: The scene shows how an act of student rebellion became institutional folklore and temporarily changed corridor access.
  relevance_to_hogwarts_a_history: A later edition can use this as evidence for Umbridge-year disorder, staff passive resistance, and the way student exploits became Hogwarts legend.
