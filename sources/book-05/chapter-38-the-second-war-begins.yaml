  source_note: After Dumbledore's return, Flitwick removes most of the portable swamp but preserves a small roped-off patch as admired magic, while Umbridge is later chased from Hogwarts by Peeves with only halfhearted restraint from staff.
  reference_type: institutional_custom
  era_classification: later_editorial_note
