  candidate_part: Ghosts, Portraits, and Magical Residents
  candidate_chapter: Resident Ghosts and Poltergeists
  candidate_section: Ghostly return, choice, and limits
  reason_for_placement: The exchange gives the clearest resident-ghost explanation of who can become a ghost and why ghostly existence is not equivalent to full return from death.
  relevance_to_hogwarts_a_history: A ghost chapter can use this as direct testimony from a Hogwarts resident ghost, with a cross-reference to Ministry research on death.
  duplicate_check:
