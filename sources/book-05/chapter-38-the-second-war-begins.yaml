  candidate_part: Later Editorial Notes
  candidate_chapter: Discipline, Punishment, and Caretaking
  candidate_section: Portable swamp memorial and Umbridge's departure
  reason_for_placement: The passage shows an act of resistance being partially incorporated into the castle's remembered space and records the staff's informal reaction to Umbridge's removal.
  relevance_to_hogwarts_a_history: A later edition can treat the swamp remnant and Peeves's escort as institutional memory of the Umbridge year and its collapse.
