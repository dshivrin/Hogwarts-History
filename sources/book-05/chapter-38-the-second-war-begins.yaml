  quote_excerpt_short: "Wizards can leave an imprint"
  source_note: Nearly Headless Nick says only wizards can return as ghosts, very few choose that path, ghosts are an imprint rather than true life, and deeper secrets of death are studied by learned wizards in the Department of Mysteries.
  reference_type: portrait_or_ghost_lore
  era_classification: later_editorial_note
  topic_tags:
