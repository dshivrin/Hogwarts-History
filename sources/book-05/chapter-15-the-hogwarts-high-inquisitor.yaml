  chapter_start_pdf_page: 1864
  chapter_end_pdf_page: 1886
  pdf_page: 1864
  printed_page: null
  extracted_text_lines: 14-79
  text_anchor:
    start_phrase: MINISTRY SEEKS EDUCATIONAL REFORM
    end_phrase: Hogwarts is a school, not an outpost of Cornelius Fudge's office
    local_occurrence_note: Hermione reads the Daily Prophet article announcing Umbridge as the first Hogwarts High Inquisitor.
  nearby_context: The article explains Educational Decree Twenty-two, Educational Decree Twenty-three, inspection powers, parent support, Lucius Malfoy's quotation, and Wizengamot resignations in protest.
  match_terms:
  - Educational Decree Twenty-two
  - Educational Decree Twenty-three
  - Hogwarts High Inquisitor
  - Ministry of Magic
  - Dolores Umbridge
  - teacher inspections
  - school governance
  quote_excerpt_short: "Educational Decree Twenty-three"
  source_note: The Prophet report gives the formal public account of Ministry legislation that placed Umbridge on the teaching staff and created the High Inquisitor role with authority to inspect other Hogwarts teachers.
  reference_type: school_rule_or_policy
  era_classification: later_editorial_note
  topic_tags:
  - educational-decrees
  - high-inquisitor
  - dolores-umbridge
  - ministry-intervention
  - school-governance
  - staff-inspections
  - lucius-malfoy
  candidate_part: Later Editorial Notes
  candidate_chapter: Headmasters and School Authority
  candidate_section: Educational Decrees and the High Inquisitor
  reason_for_placement: The passage is the clearest formal explanation of how Ministry authority entered Hogwarts staffing, inspection, and governance during Harry's fifth year.
  relevance_to_hogwarts_a_history: A later edition could cite this as the legislative turning point that converted earlier Ministry pressure into an internal supervisory office at Hogwarts.
  duplicate_check:
    possible_duplicate: true
    duplicate_of:
    - gof-ch36-005
    - ootp-ch11-006
    - ootp-ch12-006
    - ootp-ch14-006
    notes: gof-ch36-005 records Fudge's earlier governance threat, ootp-ch11-006 records Umbridge's coded policy speech, ootp-ch12-006 records the classroom curriculum effect, and ootp-ch14-006 records prefect-level pressure; this entry adds the named decrees and High Inquisitor inspection office.
  confidence: high
  limitations: The account is filtered through the Daily Prophet and Percy Weasley, so hostile framing and Ministry spin should be separated from the formal decree facts.

