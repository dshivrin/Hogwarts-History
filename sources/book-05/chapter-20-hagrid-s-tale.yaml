    text_anchor:
      start_phrase: Harry sprinted up to the boys' dormitory
      end_phrase: until at last they reached the wooden front door
      local_occurrence_note: Harry, Ron, and Hermione use the Invisibility Cloak and Marauder's Map to leave Gryffindor Tower and cross the snowy grounds to Hagrid's cabin at night.
    nearby_context: The group checks the map for Filch and Mrs. Norris, passes through the entrance hall, and reaches Hagrid's cabin unseen.
