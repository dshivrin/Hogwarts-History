      - Marauder's Map
      - Filch
      - Mrs. Norris
      - entrance hall
      - Hogwarts grounds
      - Hagrid's cabin
    quote_excerpt_short: "pausing at intervals to check the map"
    source_note: The scene corroborates the practical pairing of the Invisibility Cloak and Marauder's Map for unauthorized late-night movement through the castle and grounds.
    reference_type: magical_architecture
    era_classification: harry_era_confirmation
    topic_tags:
      - marauders-map
      - invisibility-cloak
      - castle-navigation
      - hogwarts-grounds
      - hagrids-hut
      - student-rulebreaking
      - castle-security
    candidate_part: Magical Architecture and Enchantments
    candidate_chapter: Castle Navigation, Maps, and Concealed Routes
    candidate_section: Map-and-cloak movement between tower and grounds
    reason_for_placement: The passage shows student-held navigation and concealment tools defeating ordinary night patrols from a House tower to an outbuilding.
    relevance_to_hogwarts_a_history: A later edition can use this as further evidence for unofficial movement networks and the limits of ordinary castle enforcement.
    duplicate_check:
      possible_duplicate: true
      duplicate_of:
        - poa-ch17-004
        - gof-ch25-001
      notes: poa-ch17-004 records map tracking under concealment and grounds coverage, while gof-ch25-001 records nighttime castle navigation; this entry adds a fifth-year route from Gryffindor Tower to Hagrid's cabin under Ministry-era pressure.
    confidence: high
    limitations: The tools are illicit personal artifacts, not official Hogwarts infrastructure.

