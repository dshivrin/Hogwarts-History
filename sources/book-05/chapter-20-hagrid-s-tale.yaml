    candidate_section: Ministry surveillance and the giant mission route
    reason_for_placement: The passage shows how external surveillance shaped Hogwarts-connected Order operations and constrained staff travel.
    relevance_to_hogwarts_a_history: This helps explain why a Hogwarts staff member's absence was prolonged and politically sensitive during Umbridge's year.
    duplicate_check:
