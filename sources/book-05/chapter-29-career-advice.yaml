  text_anchor:
    start_phrase: It was the first day of the Easter holidays
    end_phrase: Ron had Quidditch practice
    local_occurrence_note: Hermione creates holiday study schedules before the narrative later shows fifth- and seventh-years repeatedly using the library.
  nearby_context: Ron is startled by the six-week O.W.L. countdown, Hermione reserves Ron's weekly evening for Quidditch practice, and Harry later studies alone in the library while Hermione reviews Ancient Runes.
  match_terms:
  - Easter holidays
  - study schedules
  - exams
  - fifth years
  - seventh years
  - library
  - Quidditch practice
  quote_excerpt_short: "there were only six weeks left until their exams"
  source_note: The Easter break functions as exam-preparation time for fifth- and seventh-years, combining student-made study schedules, intensive library use, subject review, and continuing Quidditch practice.
  reference_type: curriculum_or_subject
  era_classification: harry_era_confirmation
  topic_tags:
  - exams
  - ordinary-wizarding-levels
  - study-schedules
  - library
  - easter-holidays
  - fifth-year
  - seventh-year
  candidate_part: Academic Life and Curriculum
  candidate_chapter: Examinations and Academic Progression
  candidate_section: Easter revision, library study, and exam-year pressure
  reason_for_placement: The passage shows how exam years changed holiday routines and how students used school spaces and schedules to prepare.
  relevance_to_hogwarts_a_history: This supports a curriculum section on the lived rhythm of O.W.L. and N.E.W.T. preparation, including the mix of formal pressure and student-managed study habits.
  duplicate_check:
    possible_duplicate: true
    duplicate_of:
    - ps-ch14-001
    - ootp-ch12-002
    notes: ps-ch14-001 records early-year exam revision and library work, while ootp-ch12-002 records fifth-year O.W.L. and N.E.W.T. pressure; this entry adds Easter-break exam scheduling for fifth- and seventh-years in the Umbridge year.
  confidence: high
  limitations: The passage shows student practice and narrative routine rather than an official holiday revision policy.

