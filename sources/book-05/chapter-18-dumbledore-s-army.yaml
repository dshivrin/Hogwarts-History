    text_anchor:
      start_phrase: Umbridge has been reading your mail
      end_phrase: We can't send him an owl
      local_occurrence_note: Hermione reconstructs how Filch's Dungbomb accusation could have enabled Umbridge to read Harry's letter.
    nearby_context: The discussion occurs during a noisy Charms lesson where frogs and ravens make private conversation safer.
    match_terms:
      - Umbridge
