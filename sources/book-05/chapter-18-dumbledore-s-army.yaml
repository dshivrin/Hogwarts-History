    quote_excerpt_short: "somebody just wanted an excuse to read your mail"
    source_note: Hermione's theory ties Filch's confiscation threat, Hedwig's injury, and the failed Sirius fire contact to a broader pattern of student mail and communication surveillance under Umbridge.
    reference_type: security_or_protection
    era_classification: later_editorial_note
    topic_tags:
      - communication-security
      - owl-post
      - hedwig
      - filch
      - dolores-umbridge
      - school-surveillance
      - student-rights
    candidate_part: Later Editorial Notes
    candidate_chapter: Protective Magic and Security
    candidate_section: Watched communications under the High Inquisitor
    reason_for_placement: The passage adds a student-side reconstruction of how ordinary discipline could be used to intercept private school correspondence.
    relevance_to_hogwarts_a_history: A later edition can use this as corroboration that Ministry control at Hogwarts affected privacy and student communication, not only classroom policy.
    duplicate_check:
      possible_duplicate: true
      duplicate_of: ootp-ch17-003
      notes: ootp-ch17-003 records McGonagall's warning, Hedwig's injury, and Umbridge's fire monitoring; this entry adds Hermione's specific theory that Filch's Dungbomb accusation was a pretext for reading Harry's mail.
    confidence: medium
    limitations: Hermione is inferring Umbridge's method; the chapter does not directly show Umbridge reading the letter.

