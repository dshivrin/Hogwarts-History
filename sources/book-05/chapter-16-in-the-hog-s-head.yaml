    candidate_part: Student Life and School Customs
    candidate_chapter: Hogsmeade Weekends and Student Privileges
    candidate_section: Permission Lists and Castle Departure Checks
    reason_for_placement: The evidence describes a repeated student privilege and the staff-controlled procedure for leaving the grounds.
    relevance_to_hogwarts_a_history: A history of Hogwarts student life can use this as Harry-era confirmation that village visits depended on parental or guardian permission and school exit checks.
    duplicate_check:
