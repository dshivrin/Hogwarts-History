      local_occurrence_note: The students leave Hogwarts for the first October Hogsmeade weekend.
    nearby_context: Filch checks students against a long permission list, sniffs Harry for contraband, and the trio walks from the castle steps down the drive, between the winged-boar gate pillars, and onto the village road.
