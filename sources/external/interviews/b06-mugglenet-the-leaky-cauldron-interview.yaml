      end_phrase: Then people started working it out and saying, "Where are the other kids sleeping?"
      local_occurrence_note: Later interview discussion of Hogwarts numbers, before Rowling qualifies the proposed overall population.
    nearby_context: Rowling describes creating forty fleshed-out pupils in Harry's year, including their Houses, parentage, and some personal details, while acknowledging a later school-size dilemma.
