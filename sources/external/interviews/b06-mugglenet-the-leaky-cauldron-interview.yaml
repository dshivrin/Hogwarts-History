    extracted_text_lines: null
    text_anchor:
      start_phrase: What prompted people to start referring to Voldemort as You-Know-Who and He-Who-Must-Not-Be-Named?
      end_phrase: During that time his name was never used except by Dumbledore and people who were above the superstition.
      local_occurrence_note: Interview exchange explaining the gradual avoidance of Voldemort's name and locating it by the time of his teaching-post request.
    nearby_context: Rowling connects name avoidance to Voldemort's killings and Dark Arts progress, saying that widespread fear developed gradually rather than after one discrete event.
    match_terms:
      - voldemort
      - name taboo
      - dumbledore
    quote_excerpt_short: With Voldemort? It was gradual. He was killing and doing some pretty evil things.
    source_note: Rowling says fear of Voldemort's name developed gradually as his violence and Dark Arts activity increased; by his Hogwarts teaching-post request, most people avoided it.
