    text_anchor:
      start_phrase: Can't tell you. But he did offer, you're absolutely right.
      end_phrase: Did he clearly die to try and protect Harry specifically given a clear choice? No.
      local_occurrence_note: Rowling answers why Lily's death protected Harry while James's death did not.
    nearby_context: Rowling says Voldemort offered Lily a chance to live, whereas James was going to be murdered without that choice; she distinguishes Lily's consciously chosen death from James's attempted protection.
