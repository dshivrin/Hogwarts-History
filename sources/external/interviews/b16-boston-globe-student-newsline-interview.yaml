    text_anchor:
      start_phrase: Actually, if you think about it, there is quite a bit of logic to the game.
      end_phrase: I made up the name of the game too, because I liked the sound of the word.
      local_occurrence_note: Rowling's answer to the student question about creating Quidditch.
    nearby_context: In a 1999 question-and-answer interview, Rowling explains the narrative premise behind creating Quidditch and making it a distinctive Hogwarts sport.
