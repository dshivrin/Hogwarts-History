    quote_excerpt_short: these wizards at Hogwarts had been living for hundreds and hundreds of years in a submerged society
    source_note: Rowling says her premise for Quidditch was that Hogwarts wizards had long lived inconspicuously alongside humans, so a contemporary spectator sport would draw notice; she therefore made Quidditch a separate flying school sport.
