    text_anchor:
      start_phrase: the first thing I had to decide was not what magic can do, but what it can't do.
      end_phrase: there is no returning once you're properly dead
      local_occurrence_note: Rowling's reply to Peter's suggestion that Lily Potter could return to life.
    nearby_context: In a 1999 live-radio answer about Harry's parents, Rowling explains the basic limit she set on magic before writing the series.
