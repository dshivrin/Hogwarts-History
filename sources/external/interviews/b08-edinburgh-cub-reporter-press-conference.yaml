    candidate_chapter: Castle Dangers and Protective Limits
    candidate_section: Basilisk Gaze and Indirect Viewing
    reason_for_placement: Clarifies a protective limitation relevant to the Chamber of Secrets crisis at Hogwarts.
    relevance_to_hogwarts_a_history: A Harry-era author explanation of the basilisk incident's magical mechanics, not evidence for the Chamber's origin or for a formal school safety rule.
