    text_anchor:
      start_phrase: In the second book, if you see a basilisk
      end_phrase: that is how I explained it to my self at the time.
      local_occurrence_note: Rowling's answer near the opening of the press conference to the question about glasses and a basilisk gaze.
    nearby_context: Asked whether ordinary glasses would protect a pupil from a basilisk's lethal gaze, Rowling distinguishes them from Justin Finch-Fletchley's camera-mediated view.
    match_terms:
      - basilisk-gaze
      - basilisk-glasses
      - hogwarts-student-safety
    quote_excerpt_short: glasses alone wouldn't protect you
    source_note: Rowling says ordinary glasses do not prevent a basilisk's gaze from harming a viewer; she explains Justin's protection as viewing through several camera lenses rather than directly.
    reference_type: security_or_protection
    era_classification: harry_era_confirmation
    topic_tags:
