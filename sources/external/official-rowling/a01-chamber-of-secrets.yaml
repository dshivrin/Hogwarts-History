      local_occurrence_note: Fourth body paragraph, explaining the Chamber's intended monster, its inheritable control, and Parselmouth-only entry.
    nearby_context: The snapshot explains that Slytherin made the Chamber a basilisk lair before his departure and limited control and entry to himself, descendants, or Parselmouths.
