    text_anchor:
      start_phrase: It is often asked whether a Muggle could create a magic potion, given a Potions book and the right ingredients.
      end_phrase: merely adding dead flies and asphodel to a pot hanging over a fire will give you nothing but nasty-tasting, not to mention poisonous, soup
      local_occurrence_note: Opening two body paragraphs before the comparison with spells and charms.
    nearby_context: The article directly contrasts magical potion-making with following a recipe and heating ordinary ingredients.
    match_terms:
