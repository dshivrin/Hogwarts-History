    candidate_part: Later Editorial Notes
    candidate_chapter: The Battle of Hogwarts and Its Aftermath
    candidate_section: Harry's sacrificial protection over the defenders
    reason_for_placement: "The passage supplies the final-battle explanation for why Voldemort's magic stops binding the Hogwarts defenders after Harry's surrender."
    relevance_to_hogwarts_a_history: "A later edition can use this as a capstone case study for rare protective magic operating across the school community during the battle."
    duplicate_check:
      possible_duplicate: true
      duplicate_of:
        - dh-ch35-001
        - dh-ch03-001
        - ootp-ch37-005
      notes: "dh-ch35-001 records Dumbledore's explanation of Harry's survival and Lily's blood protection; dh-ch03-001 and ootp-ch37-005 record earlier blood-ward evidence. This entry adds Harry's explicit claim that his own intended sacrifice protects the Hogwarts defenders."
    confidence: high
    limitations: "The protection is explained by Harry in the duel rather than tested in a controlled magical setting, though he cites observed failures in Voldemort's spells."

