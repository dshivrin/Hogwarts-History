      - sacrificial protection
      - Battle of Hogwarts
      - Great Hall
      - defenders
    quote_excerpt_short: "They're protected from you."
    source_note: "Harry states that his intended self-sacrifice has replicated Lily Potter's protective magic for the people fighting at Hogwarts, weakening Voldemort's ability to bind, torture, or harm them."
    reference_type: security_or_protection
    era_classification: later_editorial_note
    topic_tags:
