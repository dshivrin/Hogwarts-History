      start_phrase: "You won't be killing anyone else tonight"
      end_phrase: "You can't touch them"
      local_occurrence_note: "During the final confrontation in the Great Hall, Harry explains that his willing surrender has given the defenders protection against Voldemort's magic."
    nearby_context: "Voldemort and Harry circle each other before the gathered survivors after Harry reveals himself alive."
    match_terms:
