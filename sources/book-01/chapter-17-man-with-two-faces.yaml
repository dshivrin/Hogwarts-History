  text_anchor:
    start_phrase: No, no, no. I tried to kill you.
    end_phrase: what a waste of time
    local_occurrence_note: Quirrell's confession immediately after Harry reaches the final chamber.
  nearby_context: Quirrell explains that he was jinxing Harry's broom during the Quidditch match, that Hermione broke his eye contact by rushing at Snape, that Snape was muttering a countercurse, and that Snape refereed the next match to prevent another attempt.
  match_terms:
  - Quidditch match
  - broom
  - eye contact
  - countercurse
  - Snape
  - Dumbledore
  - referee
  quote_excerpt_short: "muttering a countercurse"
  source_note: Quirrell confirms that the earlier broom incident was his attack, not Snape's, and says Snape tried to protect Harry through counter-magic and later refereeing.
  reference_type: security_or_protection
  era_classification: later_editorial_note
  topic_tags:
  - broom-jinx
  - countercurse
  - quidditch-safety
  - match-security
  - professor-quirrell
  - professor-snape
  - dumbledore
  candidate_part: Protective Magic and Security
  candidate_chapter: Magical Interference and Student Safety
  candidate_section: Quidditch Match Risks
  reason_for_placement: The confession corrects the causality of an earlier match-safety incident and identifies both hostile interference and defensive counter-magic during a school match.
  relevance_to_hogwarts_a_history: This is later editorial evidence for magical interference risks in Hogwarts recreation and for staff response to suspected match danger.
  duplicate_check:
    possible_duplicate: true
    duplicate_of: ps-ch11-006
    notes: Chapter Eleven recorded the observed broom interference and Hagrid's Dark Magic assessment; this entry identifies Quirrell as the attacker and Snape's countercurse and refereeing as protective actions.
  confidence: high
  limitations: The incident is specific to Harry's first year and does not establish a general Hogwarts policy for preventing magical interference in Quidditch.
