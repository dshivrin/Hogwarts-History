tags_added:
  oq-research-lead: A specific authorial/official or companion source has been found as a lead; check actual
    passage and question scope.
  oq-research-pending: No answer has been established by this pass; not proof that a canonical answer does
    not exist.
  oq-evidence-then-residual-question: Source has partial answer; narrow remaining unknown.
  oq-ask-or-qualified-reconstruction: Use historian question or explicitly conditional interpretation only.
  oq-research-then-bounded-inference: Research before interpretive, non-factual reconstruction.
  oq-editorial-resolution: Placement/duplicate/provenance decision required, not a lore mystery.
  oq-later-editorial-context: Post-cutoff event or testimony is not original authorial knowledge.
  oq-excluded-topic: Retain for research only; no manuscript use.
  oq-technical-only: Repository locator/process task, not book prose.
  oq-era-*: Era classification requires verification and plausible author access.
  oq-chapter-*: Proposed destination key; only C1-C3 are currently confirmed.
  oq-content-excluded-house-elves: Exclude house-elf detail even when embedded in another question.
source_registry:
  P-NOVELS:
    type: primary_novels
    locator: harrypotter.pdf
    use_and_limit: The seven novels; check exact chapter, PDF page, speaker and scene context. A post-1984
      scene may retrospectively reveal older history.
  P-QUIDDITCH:
    type: companion
    locator: quidditch-through-the-ages.pdf
    use_and_limit: Check dated game history and Hogwarts-specific mentions; do not transfer professional rules
      to school policy without support.
  P-BEEDLE:
    type: companion
    locator: Beedle The Bard_text.pdf
    use_and_limit: Check Dumbledore commentary for dated school memories, especially the pantomime; distinguish
      later commentary from an earlier book edition.
  P-BEASTS:
    type: companion
    locator: Fantastic-Beasts-Where-to-Find-Them.pdf
    use_and_limit: Image-heavy companion; visually inspect relevant entries and distinguish creature lore from
      Hogwarts rules.
  W-SORT:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/the-sorting-hat
    use_and_limit: The founders jointly enchanted Godric’s hat; Legilimency and founder intelligence. Origin
      is presented partly as legend.
  W-HATSTALL:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/hatstall
    use_and_limit: Historical sorting deliberations and Hatstall terminology; examples have individual dates.
  W-BOOK:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/the-quill-of-acceptance-and-the-book-of-admittance
    use_and_limit: Founders-era Book and Quill, their function and limitations; not an explanation of moving
      address labels.
  W-MAP:
    type: official_reference
    locator: https://www.harrypotter.com/fact-file/objects/the-marauders-map
    use_and_limit: Names four makers and Homonculous Charm, map resistance to concealment. Concise overview;
      verify chronology in novels.
  W-PEEVES:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/peeves
    use_and_limit: Peeves is a poltergeist present since founders; names founder-appointed caretaker and an
      unsuccessful removal in 1876.
  W-SWORD:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/the-sword-of-gryffindor
    use_and_limit: Ragnuk I made sword for Godric; later returns to worthy Gryffindors; not a technical account
      of its hat mechanism.
  W-CHAMBER:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/chamber-of-secrets
    use_and_limit: Founder’s secret room, original trapdoor, eighteenth-century plumbing adaptation by Corvinus
      Gaunt, and limits of later searches.
  W-PENSIEVE:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/pensieve
    use_and_limit: Ancient communal Pensieve and school headmasters’ memory archive; the find-at-building-site
      story is expressly unsubstantiated.
  W-TRAIN:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/the-hogwarts-express
    use_and_limit: Pre-train travel, Portkey period and ministerial train reform; source distinguishes train
      provenance as unproven.
  W-KINGS:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/kings-cross-station
    use_and_limit: Concealed platform attributed to minister Evangeline Orpington, 1849–1855; separate from
      first-year boat custom.
  W-GHOSTS:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/hogwarts-ghosts
    use_and_limit: Four House ghosts, Myrtle’s return, Binns’ death; does not supply an exact death year for
      Binns.
  W-PORTRAITS:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/hogwarts-portraits
    use_and_limit: Explains portraits’ capabilities and the training of headmasters’ portraits; do not infer
      founding date for the custom.
  W-LUPIN:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/remus-lupin
    use_and_limit: Pre-1984 student accommodation for Remus, secrecy and headmaster’s arrangements; distinguish
      1993 faculty appointment.
  W-WILLOW:
    type: official_reference
    locator: https://www.harrypotter.com/fact-file/plants-and-potions/the-whomping-willow
    use_and_limit: The Willow guards a route to Lupin’s transformation refuge; no complete formal authorization
      record.
  W-HALL:
    type: official_reference
    locator: https://www.harrypotter.com/fact-file/locations/the-great-hall
    use_and_limit: Confirms ceiling reflects time of day and weather; does not identify builder, spell or maintenance
      regime.
  W-PASSAGES:
    type: official_feature
    locator: https://www.harrypotter.com/features/the-camouflaged-corners-and-secret-spaces-of-hogwarts
    use_and_limit: Quotes seven mapped Hogsmeade passages, four known to Filch; distinguish Harry-era knowledge
      from 1984 authorial knowledge.
  W-HONEY:
    type: official_reference
    locator: https://www.harrypotter.com/fact-file/locations/honeydukes
    use_and_limit: Passage connects Honeydukes basement with Hogwarts one-eyed-witch statue; construction date
      unprovided.
  W-HOGSMEADE:
    type: official_reference
    locator: https://www.harrypotter.com/fact-file/locations/hogsmeade
    use_and_limit: Town and third-year visits; no date of first permission system.
  W-FOUNDERS:
    type: official_feature
    locator: https://www.harrypotter.com/features/origins-of-hogwarts-school-of-witchcraft-and-wizardry
    use_and_limit: Founders and broad tenth-century frame; secondary official synthesis, not a dated original
      founding charter.
  W-POTTER:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/the-potter-family
    use_and_limit: Linfred of Stinchcombe and Potter ancestry; family history is not automatic Hogwarts history.
  W-LEAKY:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/the-leaky-cauldron
    use_and_limit: Historical route into Diagon Alley and historical changes; not proof Hogwarts mandated the
      route.
  W-CROSS:
    type: official_reference
    locator: https://www.harrypotter.com/fact-file/locations/platform-nine-and-three-quarters
    use_and_limit: Platform and barrier overview; source for its existence, not the mechanism of the 1992 closure.
  W-ROR:
    type: official_reference
    locator: https://www.harrypotter.com/fact-file/locations/the-room-of-requirement
    use_and_limit: Shows later discovery and use of Room of Requirement, not proof that the 1984 author knew
      it.
  W-QUCOMP:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/history-of-the-quidditch-world-cup
    use_and_limit: International competition history and regulations; cannot be assumed to regulate Hogwarts
      matches.
  W-MCG:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/professor-mcgonagall
    use_and_limit: McGonagall’s documented school record and Quidditch accident; distinguish student history
      from post-1984 offices.
  W-MIRROR:
    type: authorial
    locator: https://www.harrypotter.com/writing-by-jk-rowling/the-mirror-of-erised
    use_and_limit: Unknown creator and arrival; approximately a century in the Room of Requirement before Dumbledore
      modified it for the Stone in 1991. Original author could not know 1991 modifications.
codex_iteration_instructions:
- At the start of each new chapter iteration, open the current approved chapter outline and read only questions
  whose primary or secondary destination matches that chapter. Confirm the local files and source YAML rather
  than treating this enriched backlog as new canon. Research specific leads (original seven-novel PDF, three
  companion PDFs, existing evidence YAML, first-party Rowling material, then carefully labelled secondary discovery
  sources), log the exact entry ID, chapter, page or archival URL and what the source actually supports. If
  the current project outline differs from the thematic placeholders, update the placement in the new working
  copy; do not silently renumber or edit the approved outline, completed chapters or source records.
- 'Before drafting, assign each question one outcome: documented answer, narrower unresolved question, bounded
  historian inference, explicitly speculative flourish, later editorial annotation, excluded matter or repository-only
  cleanup. A pre-1984 event is NOT enough for the original book: the narrator must plausibly have access to
  it, and outside authorial explanations published later are not themselves proof of contemporary access. In
  the prose use questions sparingly, as purposeful transitions or source-critical observations; any creative
  details must be identifiable as conjecture and consistent with known magic, dates and voices. Never invent
  canon sources, direct quotations, official offices, rules, spells or precise dates. Append a per-chapter
  question-resolution log; leave original question status unchanged until exact evidence or an editorial decision
  is recorded.'
